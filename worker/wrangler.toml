# WorldMind API 프록시 — Cloudflare Worker 설정 (CLI 배포용)
# 대시보드에서 붙여넣기로 배포한다면 이 파일은 필요 없습니다. README.md 참고.

name = "worldmind-api"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[vars]
# 허용할 사이트 주소 (쉼표로 여러 개). GitHub Pages 주소로 바꾸세요.
# 로컬 파일(file://)로도 테스트하려면 ",null" 을 덧붙이세요.
ALLOWED_ORIGINS = "https://YOUR-GITHUB-ID.github.io"

# 비밀 변수는 파일에 쓰지 말고 아래 명령으로 등록하세요:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put MASTER_CODE
#   npx wrangler secret put GOOGLE_API_KEY     (이미지 생성을 쓸 때만)
