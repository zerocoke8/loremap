<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldMind — 세계관 마인드맵</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ================= §7-1 색상 토큰 (스펙 그대로) ================= */
:root{
  --bg:#0a0b0f; --bg2:#10121a; --bg3:#161824;
  --surface:#1c1f2e; --surface2:#242740;
  --border:#2e3250; --border2:#3d4270;
  --accent:#7c6af7; --accent2:#a594ff;
  --gold:#d4a947; --gold2:#f0c96a;
  --text:#e8eaf6; --text2:#9da3c8; --text3:#5a607a;
  --danger:#e05c7a; --ok:#4ade9e;
  --shadow:0 8px 32px rgba(0,0,0,.6); --shadow-sm:0 4px 18px rgba(0,0,0,.45);
  --glass:rgba(28,31,46,.96); --ov-bg:rgba(6,7,11,.66); --grid:rgba(157,163,200,.13);
  --line-faint:rgba(255,255,255,.13); --edge:#565d8f; --edge-parent:#8b93c9;
  --icon-shadow:drop-shadow(0 0 6px rgba(0,0,0,.6));
  --rp-w:320px;
  --c-world:#9b59d6;  --c-world-bg:rgba(74,32,96,.65);
  --c-group:#4a9edd;  --c-group-bg:rgba(26,58,92,.65);
  --c-space:#3ecfb8;  --c-space-bg:rgba(20,70,65,.65);
  --c-char:#6bbd4a;   --c-char-bg:rgba(42,64,32,.65);
  --c-item:#e8b84b;   --c-item-bg:rgba(70,55,10,.65);
  --c-trait:#d4914a;  --c-trait-bg:rgba(74,48,16,.65);
  --c-custom:#5a6090; --c-custom-bg:rgba(30,32,53,.65);
}
/* 라이트 테마(베이지 배경 + 검은 글씨) — 설정에서 선택, wm_theme 저장 */
body.light{
  --bg:#f4eee3; --bg2:#ece5d7; --bg3:#e3dbc9;
  --surface:#fbf8f1; --surface2:#f2ece0;
  --border:#d8cfbb; --border2:#c2b69d;
  --accent:#6a5ae0; --accent2:#5344cc;
  --gold:#b8891f; --gold2:#8f6a12;
  --text:#1f2230; --text2:#4b5168; --text3:#8b90a6;
  --danger:#c53a5e; --ok:#1e9a67;
  --shadow:0 8px 28px rgba(70,55,30,.18); --shadow-sm:0 4px 14px rgba(70,55,30,.14);
  --glass:rgba(251,248,241,.97); --ov-bg:rgba(60,50,35,.45); --grid:rgba(90,80,60,.16);
  --line-faint:rgba(0,0,0,.12); --edge:#8d8570; --edge-parent:#6a6280; --icon-shadow:none;
  --c-world:#8a45c9; --c-world-bg:rgba(155,89,214,.13);
  --c-group:#3383c4; --c-group-bg:rgba(74,158,221,.15);
  --c-space:#1fa893; --c-space-bg:rgba(62,207,184,.17);
  --c-char:#579c3a;  --c-char-bg:rgba(107,189,74,.17);
  --c-item:#c9961f;  --c-item-bg:rgba(232,184,75,.22);
  --c-trait:#b5762f; --c-trait-bg:rgba(212,145,74,.2);
  --c-custom:#6b7199;--c-custom-bg:rgba(90,96,144,.13);
  background:
    radial-gradient(1200px 700px at 70% -10%, rgba(124,106,247,.08), transparent 60%),
    radial-gradient(900px 600px at 10% 110%, rgba(184,137,31,.08), transparent 55%),
    var(--bg);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 700px at 70% -10%, rgba(124,106,247,.09), transparent 60%),
    radial-gradient(900px 600px at 10% 110%, rgba(212,169,71,.05), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  font-size:14px;
  display:flex;flex-direction:column;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{
  font-family:inherit;font-size:13px;color:var(--text);
  background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;width:100%;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;line-height:1.55}
:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
.hide{display:none!important}
[hidden]{display:none!important}

/* ================= 탭 바 ================= */
#tabbar{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px 0;background:var(--bg2);
  border-bottom:1px solid var(--border);
  min-height:42px;flex-wrap:wrap;
}
.logo{
  font-family:'Cinzel',serif;font-weight:700;font-size:17px;letter-spacing:.14em;
  background:linear-gradient(120deg,var(--gold2),var(--gold) 55%,#9a7527);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  padding:0 14px 6px 2px;user-select:none;text-shadow:0 0 24px rgba(212,169,71,.25);
}
#tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.tab{
  display:flex;align-items:center;gap:2px;max-width:220px;
  background:var(--bg3);border:1px solid var(--border);border-bottom:none;
  border-radius:10px 10px 0 0;padding:6px 8px 7px 12px;
  color:var(--text2);transition:background .15s,color .15s;
}
.tab .tt{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tab.act{background:var(--surface2);color:var(--text);border-color:var(--border2);box-shadow:0 -2px 12px rgba(124,106,247,.12) inset}
.tab.act .tt{font-weight:500}
.tacts{display:none;gap:1px;margin-left:4px}
body.edit .tab:hover .tacts,body.edit .tab.act .tacts{display:inline-flex}
.ta{font-size:11px;color:var(--text3);padding:2px 4px;border-radius:5px;line-height:1}
.ta:hover{color:var(--text);background:var(--border)}
.ta.td:hover{color:var(--danger)}
.tabadd{
  font-size:15px;color:var(--text3);padding:3px 10px 5px;border-radius:8px;margin-bottom:4px;
}
.tabadd:hover{color:var(--gold2);background:var(--bg3)}

/* ================= 탑바 ================= */
#topbar{
  display:flex;align-items:center;gap:6px;padding:8px 12px;
  background:var(--bg2);border-bottom:1px solid var(--border);
  flex-wrap:wrap;position:relative;z-index:30;
}
.tb{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--surface);border:1px solid var(--border);border-radius:9px;
  padding:7px 12px;font-size:13px;color:var(--text2);
  transition:border-color .15s,color .15s,background .15s;white-space:nowrap;
}
.tb:hover{border-color:var(--accent);color:var(--text)}
.tb.gold{border-color:rgba(212,169,71,.45);color:var(--gold2)}
.tb.gold:hover{border-color:var(--gold);background:rgba(212,169,71,.08)}
.tb.on{border-color:var(--accent);color:var(--accent2);background:rgba(124,106,247,.1)}
.tb:disabled{opacity:.4;cursor:not-allowed}
.sp{flex:1}
.eo{display:none}
body.edit .eo{display:inline-flex}
body.edit div.eo,body.edit span.eo{display:flex}

/* 동기화 상태 칩 */
#syncChip{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text3);
  padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:breathe 2.4s ease-in-out infinite}
.dot.warn{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.dot.err{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.dot.off{background:var(--text3)}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}

/* ================= 메인 레이아웃 ================= */
#main{flex:1;display:flex;min-height:0;position:relative}
#cwrap{
  flex:1;position:relative;overflow:hidden;min-width:0;
  background:var(--bg);cursor:grab;touch-action:none;user-select:none;
}
#cwrap.panning{cursor:grabbing}
#world{
  position:absolute;left:0;top:0;width:4000px;height:4000px;
  transform-origin:0 0;
  background-image:radial-gradient(var(--grid) 1.1px, transparent 1.1px);
  background-size:42px 42px;
}
#edgeSvg{position:absolute;left:0;top:0;width:4000px;height:4000px;pointer-events:none;overflow:visible}
#edgeSvg .e-hit,#edgeSvg .e-lbl{pointer-events:auto;cursor:pointer}
#nodes{position:absolute;left:0;top:0;width:4000px;height:4000px;pointer-events:none}

/* ================= 노드 카드 ================= */
.node{
  position:absolute;pointer-events:auto;touch-action:none;
  min-width:120px;max-width:240px;
  border:1.5px solid var(--c, var(--border2));border-radius:12px;
  /* backdrop-filter 는 겹친 카드 뒤를 뿌옇게 만들어 읽기 어려웠다 — 제거 */
  background:var(--c-bg, var(--surface));
  z-index:1;
  box-shadow:var(--shadow-sm);
  padding:9px 12px;cursor:pointer;user-select:none;
  transition:box-shadow .18s,border-color .18s;
}
.node:hover{box-shadow:var(--shadow-sm),0 0 14px rgba(124,106,247,.18)}
.node.drag{cursor:grabbing;opacity:.92}
.nh{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.nn{font-size:13.5px;font-weight:500;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.nh{flex-wrap:wrap}
.nt{font-size:10px;color:var(--text2);opacity:.85;border:1px solid var(--line-faint);border-radius:8px;padding:1px 6px;flex:none}
/* 카드에 보이는 속성 요약 — 최대 4개, 나머지는 상세에서 */
.np{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.npi{font-size:10.5px;color:var(--text2);background:var(--bg3);border-radius:7px;padding:1px 6px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.npi b{color:var(--text3);font-weight:500;margin-right:4px}
.nd{
  display:none;margin-top:8px;padding-top:7px;font-size:12px;line-height:1.6;color:var(--text2);
  border-top:1px solid var(--line-faint);word-break:keep-all;overflow-wrap:anywhere;
  max-height:200px;overflow:auto;
}
.node.exp .nd{display:block}
/* 펼치거나 선택한 카드는 항상 다른 카드 위에 — 커진 카드가 가려지지 않게 */
.node.sel{z-index:2}
.node.exp{z-index:3}
.node.exp.sel{z-index:4}
.node.sel{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(165,148,255,.45),0 0 22px rgba(124,106,247,.35)}
.node.preview .nn{font-weight:700}
.node.preview{animation:pulseGold 1.5s ease-in-out infinite}
@keyframes pulseGold{
  0%,100%{box-shadow:0 0 0 1px rgba(240,201,106,.6),0 0 14px rgba(212,169,71,.35)}
  50%{box-shadow:0 0 0 3px rgba(240,201,106,.9),0 0 30px rgba(212,169,71,.65)}
}
@keyframes pulseLine{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}

/* 연결선 — 색 우선순위: 기본색 < --ec(상위 노드 색 모드) < 미리보기(preview) < 선택(esel) */
.e-line{fill:none;stroke:var(--ec, var(--edge));stroke-width:2}
.e-line.parent{stroke:var(--ec, var(--edge-parent));stroke-width:2.4}
.e-line.normal{stroke-dasharray:6 5;stroke-width:1.8}
.e-hit{fill:none;stroke:rgba(0,0,0,0);stroke-width:22;vector-effect:non-scaling-stroke}
.e-lbl rect{fill:var(--glass);stroke:var(--ec, var(--border2));stroke-width:1;rx:7}
.e-lbl text{fill:var(--text2);font-size:11.5px;font-family:'Noto Sans KR',sans-serif;text-anchor:middle}
#edgeSvg g.preview .e-line{stroke:var(--gold2);animation:pulseLine 1.5s ease-in-out infinite}
#edgeSvg g.preview .e-lbl rect{stroke:var(--gold)}
#edgeSvg .e-lbl:hover rect{stroke:var(--accent2)}
#edgeSvg g.esel .e-line{stroke:var(--accent2);filter:drop-shadow(0 0 5px rgba(165,148,255,.8))}
#edgeSvg g.esel .e-lbl rect{stroke:var(--accent2)}
#edgeSvg g.esel .e-lbl text{fill:var(--text)}

/* 관계 상세 카드 (선 클릭 시 중앙에 표시) */
.e-detail{
  position:absolute;pointer-events:auto;touch-action:none;transform:translate(-50%,-50%);
  min-width:160px;max-width:270px;
  background:var(--glass);border:1px solid var(--ec, var(--accent2));border-radius:11px;
  padding:10px 13px;box-shadow:var(--shadow),0 0 18px rgba(124,106,247,.3);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:default;user-select:none;
}
.e-detail.preview{border-color:var(--gold)}
.ed-t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.ed-tag{margin-left:auto;flex:none;font-size:10px;font-weight:400;color:var(--text2);border:1px solid var(--line-faint);border-radius:8px;padding:1px 6px}
.ed-d{font-size:12px;line-height:1.6;color:var(--text2);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;max-height:180px;overflow:auto}
.ed-d.empty-d{color:var(--text3);font-style:italic}

/* 캔버스 오버레이 요소 */
#linkBanner{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:10px;
  background:var(--glass);border:1px solid var(--accent);border-radius:24px;
  padding:9px 16px;font-size:13px;color:var(--accent2);box-shadow:var(--shadow);
  backdrop-filter:blur(6px);white-space:nowrap;
}
#linkBanner button,#pickBanner button{font-size:12px;color:var(--text3);border:1px solid var(--border);border-radius:14px;padding:3px 10px}
#linkBanner button:hover,#pickBanner button:hover{color:var(--text);border-color:var(--border2)}
#pickBanner{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:9px;
  background:var(--glass);border:1px solid var(--gold);border-radius:24px;
  padding:9px 16px;font-size:13px;color:var(--gold2);box-shadow:var(--shadow);
  backdrop-filter:blur(6px);white-space:nowrap;
}
#pickBanner b{font-variant-numeric:tabular-nums}
#pickBanner button.go{color:var(--gold2);border-color:var(--gold)}
#pickBanner button.go:hover{background:rgba(212,169,71,.14)}
#pickBanner button:disabled{opacity:.45;cursor:not-allowed}
.imp-drop{outline:2px dashed var(--accent2);outline-offset:-6px}
.hint-inline{color:var(--text3);font-size:11px;font-weight:400;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border2);border-radius:999px;padding:4px 11px;font-size:12px;
  background:var(--bg3);color:var(--text3)}
.chip.on{border-color:var(--accent2);color:var(--text);background:rgba(124,106,247,.16)}
.prop-row{display:flex;gap:6px;margin-bottom:6px}
.prop-row .pk{flex:0 0 34%;min-width:0}
.prop-row .pv{flex:1;min-width:0}
.ty-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ty-dot{width:15px;height:15px;border-radius:5px;flex:none;border:1.5px solid rgba(0,0,0,.25)}
.ty-row input{flex:1;min-width:0}
.ty-btn{flex:none;width:32px;height:32px;border:1px solid var(--border2);border-radius:9px;
  background:var(--bg3);color:var(--text2);font-size:14px;line-height:1}
.ty-btn:disabled{opacity:.3;cursor:not-allowed}
.ty-btn.dngr{color:var(--danger)}
.ty-tier{flex:none;width:16px;text-align:right;color:var(--text3);font-size:11px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1;min-width:150px}
.hint{margin-top:7px;color:var(--text3);font-size:12px;line-height:1.6}
#searchBar{
  position:absolute;left:14px;top:14px;z-index:40;display:flex;align-items:center;gap:6px;
  background:var(--bg2);border:1px solid var(--border2);border-radius:12px;
  padding:6px 8px;box-shadow:var(--shadow-sm)
}
#searchBar input{
  width:190px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;
  padding:5px 9px;color:var(--text);font-size:13px;font-family:inherit
}
#searchBar button{
  width:28px;height:28px;flex:none;border:1px solid var(--border2);border-radius:8px;
  background:var(--bg3);color:var(--text2);font-size:13px;line-height:1
}
#searchBar button:disabled{opacity:.3;cursor:not-allowed}
#searchCount{font-size:12px;color:var(--text3);min-width:42px;text-align:center}
/* 검색 결과 강조 — 현재 항목은 더 강하게 */
.node.found{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(240,201,106,.45)}
.node.found.cur{box-shadow:0 0 0 3px var(--gold),0 0 30px rgba(240,201,106,.85);z-index:5}
#marquee{
  position:absolute;z-index:16;pointer-events:none;border-radius:4px;
  border:1.5px dashed var(--accent2);background:rgba(124,106,247,.10);
}
.guide{position:absolute;pointer-events:none;z-index:6}
.gv{top:0;height:4000px;width:0;border-left:1.5px dashed var(--gold)}
.gh{left:0;width:4000px;height:0;border-top:1.5px dashed var(--gold)}
#genOverlay{
  position:absolute;inset:0;z-index:22;display:flex;flex-direction:column;gap:16px;
  align-items:center;justify-content:center;background:var(--ov-bg);
  backdrop-filter:blur(3px);font-size:14px;color:var(--gold2);
}
.spin{
  width:38px;height:38px;border-radius:50%;
  border:3px solid rgba(212,169,71,.2);border-top-color:var(--gold2);
  animation:spin .9s linear infinite;
}
.spin.sm{width:20px;height:20px;border-width:2.5px}
@keyframes spin{to{transform:rotate(360deg)}}
#zoomCtl{
  position:absolute;right:16px;bottom:16px;z-index:20;
  display:flex;flex-direction:column;gap:6px;
}
#zoomCtl button{
  width:38px;height:38px;border-radius:11px;font-size:16px;
  background:var(--glass);border:1px solid var(--border);color:var(--text2);
  backdrop-filter:blur(5px);
}
#zoomCtl button:hover{border-color:var(--accent);color:var(--text)}
#aiPanel{
  position:absolute;right:16px;bottom:16px;z-index:24;width:250px;
  background:var(--glass);border:1px solid var(--gold);border-radius:14px;
  padding:14px;box-shadow:var(--shadow),0 0 26px rgba(212,169,71,.22);
  backdrop-filter:blur(8px);
}
#aiPanel .ai-h{font-size:13.5px;font-weight:700;color:var(--gold2);margin-bottom:7px}
#aiPanel .ai-info{font-size:12.5px;color:var(--text2);line-height:1.6;margin-bottom:11px}
#aiPanel .ai-btns{display:flex;gap:6px;flex-wrap:wrap}
#aiPanel .tb{padding:6px 10px;font-size:12.5px}

/* ================= 우측 패널 ================= */
#rp{
  width:var(--rp-w);flex:none;display:flex;flex-direction:column;min-height:0;
  background:var(--bg2);border-left:1px solid var(--border);
}
.rp-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;border-bottom:1px solid var(--border);
}
.rp-h span{font-weight:700;font-size:14px;letter-spacing:.02em}
.rp-h button{color:var(--text3);font-size:14px;padding:2px 6px;border-radius:6px}
.rp-h button:hover{color:var(--text);background:var(--bg3)}
.rp-b{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.rp-sec{font-size:12px;color:var(--text3);font-weight:500;letter-spacing:.04em;margin-bottom:-4px}
.btnrow{display:flex;gap:7px;flex-wrap:wrap}
.refgrid{display:flex;gap:8px}
.ref-slot{
  position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;
  border:1px solid var(--border);background:var(--bg3);
  display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:20px;
}
.ref-slot img{width:100%;height:100%;object-fit:cover}
.ref-slot .rx{

<script>
'use strict';
/* ==================================================================
 * §1 데이터 스키마 상수 — 변경 금지 (기존 DB 호환)
 * ================================================================== */
let idC = Date.now();
const gid = () => 'i' + (idC++);

/* §1 노드 타입 — 탭마다 따로 가지며, 배열 순서가 곧 상하위 단계다(맨 위=최상위).
   색은 순서대로 자동 배정하므로 사용자는 이름만 정하면 된다. 이모지는 쓰지 않는다.
   ⚠ key 는 node.type 에 저장되는 값이라 한번 만들면 바꾸지 않는다(label 만 변경). */
const DEFAULT_TYPES = [
  {key:'world', label:'세계'}, {key:'group', label:'집단'}, {key:'space', label:'공간'},
  {key:'char',  label:'인물'}, {key:'item',  label:'사물'}, {key:'trait', label:'성격'},
  {key:'custom', label:'기타'}
];
/* 기본 7종의 기존 색을 HSL로 옮긴 값 — 그 뒤 순서는 색상환을 돌며 자동 생성 */
const TYPE_HSL = [[276,60,59],[205,68,58],[170,60,53],[100,45,52],[45,77,60],[29,62,56],[232,23,46]];

function typeList(tab){
  const l = tab && tab.nodeTypes;
  return (Array.isArray(l) && l.length) ? l : DEFAULT_TYPES;
}
function typeIndexOf(tab, key){
  const l = typeList(tab);
  const i = l.findIndex(t => t.key === key);
  return i < 0 ? l.length - 1 : i;          // 모르는 타입은 최하위로 취급
}
function typeLabel(tab, key){
  const t = typeList(tab).find(x => x.key === key);
  return t ? t.label : '기타';
}
/* AI 응답 등 외부에서 온 타입 값을 이 탭의 실제 key 로 보정 */
function typeKeyOr(tab, key){
  const l = typeList(tab);
  if(l.some(t => t.key === key)) return key;
  const byLabel = l.find(t => t.label === key);      // AI가 라벨을 그대로 준 경우
  return byLabel ? byLabel.key : l[l.length - 1].key;
}
function typeHslAt(i){ return TYPE_HSL[i] || [(i * 47 + 276) % 360, 55, 58]; }
function typeColorsAt(i){
  const [h, sa, l] = typeHslAt(i);
  return curTheme === 'light'
    ? {border:`hsl(${h} ${sa}% ${Math.max(26, l - 16)}%)`, bg:`hsl(${h} ${sa}% ${l}% / .15)`}
    : {border:`hsl(${h} ${sa}% ${l}%)`, bg:`hsl(${h} ${Math.round(sa*.72)}% ${Math.round(l*.36)}% / .65)`};
}
/* 복사 이미지 전용 — 어떤 테마에서 복사하든 흰 배경 + 라이트 테마 색으로 고정한다.
   붙여넣는 곳(문서·메신저)이 대개 흰 바탕이라 다크 테마 색은 읽기 어렵다. */
function typeColorsLightAt(i){
  const [h, sa, l] = typeHslAt(i);
  return {border:`hsl(${h} ${sa}% ${Math.max(26, l - 16)}%)`, bg:`hsl(${h} ${sa}% ${l}% / .18)`};
}
const SHOT = {bg:'#ffffff', text:'#1a1a20', text2:'#5a5a68', edge:'#7c7c90'};

/* 테마별 테두리·배경색 — 라이트는 진한 테두리+옅은 배경, 다크는 밝은 테두리+어두운 배경 */
function typeColors(tab, key){ return typeColorsAt(typeIndexOf(tab, key)); }
/* 노드가 가진 타입 목록(주 타입이 맨 앞). 색·정렬은 항상 types[0] = type 을 쓴다 */
function nodeTypes(n){ return (Array.isArray(n.types) && n.types.length) ? n.types : [n.type]; }
function nodeTypeLabels(tab, n){ return nodeTypes(n).map(k => typeLabel(tab, k)); }
/* 타입에 정의된 기본 속성 이름들 — 새 노드에 빈칸으로 깔아준다 */
function typeFields(tab, key){
  const t = typeList(tab).find(x => x.key === key);
  return (t && Array.isArray(t.fields)) ? t.fields : [];
}
function propGet(n, k){
  const p = (n.props || []).find(x => x.k === k);
  return p ? p.v : '';
}

/* 새 타입 key — 라벨과 독립적인 안정 식별자 */
function newTypeKey(){ return 'ty' + (idC++); }

function sanitizeTab(t){
  /* 구버전 데이터에는 nodeTypes 가 없다 — 기본 7종으로 채우면 기존 node.type 이 그대로 맞는다 */
  if(!Array.isArray(t.nodeTypes) || !t.nodeTypes.length){
    t.nodeTypes = DEFAULT_TYPES.map(x => ({...x}));
  }else{
    t.nodeTypes = t.nodeTypes
      .filter(x => x && x.key)
      .map(x => ({key: String(x.key), label: String(x.label ?? '무제').slice(0, 20),
                 fields: Array.isArray(x.fields)
                   ? x.fields.map(f => String(f).slice(0, 24)).filter(Boolean).slice(0, 20) : []}));
    if(!t.nodeTypes.length) t.nodeTypes = DEFAULT_TYPES.map(x => ({...x}));
  }
  if(!t.nodes) t.nodes = [];
  /* 노드: 복수 타입(types)과 속성(props) 보정. 구 데이터에는 둘 다 없다.
     ⚠ type 은 항상 types[0] 과 같게 유지한다 — 색·정렬·AI 프롬프트가 전부 type 을 읽는다. */
  t.nodes.forEach(n => {
    const keys = t.nodeTypes.map(x => x.key);
    let ts = Array.isArray(n.types) ? n.types : (n.type ? [n.type] : []);
    ts = ts.map(String).filter((k, i, a) => keys.includes(k) && a.indexOf(k) === i);
    if(!ts.length) ts = [n.type && keys.includes(n.type) ? n.type : keys[keys.length - 1]];
    n.types = ts;
    n.type = ts[0];
    n.props = (Array.isArray(n.props) ? n.props : [])
      .filter(p => p && String(p.k ?? '').trim())
      .map(p => ({k: String(p.k).slice(0, 24), v: String(p.v ?? '').slice(0, 300)}))
      .slice(0, 40);
  });
  if(!t.edges) t.edges = [];
  if(!t.events) t.events = [];
  if(!t.refImages) t.refImages = [];
  if(t.worldPrompt == null) t.worldPrompt = '';
  if(!t.title) t.title = '무제';
  return t;
}

/* §6-1 AI 모델 — 한 곳에서 관리 */
const AI_MODEL  = 'claude-opus-5';
const IMG_MODEL = 'gemini-3.1-flash-image-preview';

/* ==================================================================
 * ★ 배포 설정 — 관리자가 이 두 값만 채웁니다 (README.md 참고)

function wrapCJK(str, maxChars){
  const chars = [...String(str ?? '')];
  const out = []; let cur = '';
  for(const ch of chars){
    cur += ch;
    if(cur.length >= maxChars){ out.push(cur); cur = ''; }

/* ==================================================================
 * §6-3 AI JSON 파싱 — 3단 방어
 * ================================================================== */

/* 1단: 브래킷 카운팅 추출 — 문자열/이스케이프 인식, 첫 완전한 블록만 */
function extractBlock(src, open, close){
  const s = String(src ?? '');
  const start = s.indexOf(open);
  if(start < 0) return null;
  let depth = 0, inStr = false, esc = false;
  for(let i = start; i < s.length; i++){
    const c = s[i];
    if(inStr){
      if(esc) esc = false;
      else if(c === '\\') esc = true;
      else if(c === '"') inStr = false;
      continue;
    }
    if(c === '"'){ inStr = true; continue; }
    if(c === open) depth++;
    else if(c === close){
      depth--;
      if(depth === 0) return s.slice(start, i + 1);
    }
  }
  return null; // 미완성(잘린) 블록
}

/* 열린 괄호 스택/문자열 상태 계산 */
function scanState(s){
  const stack = []; let inStr = false, esc = false;
  for(const c of s){
    if(inStr){
      if(esc) esc = false;
      else if(c === '\\') esc = true;
      else if(c === '"') inStr = false;
    } else {
      if(c === '"') inStr = true;
      else if(c === '{') stack.push('}');
      else if(c === '[') stack.push(']');
      else if(c === '}' || c === ']') stack.pop();
    }
  }
  return {stack, inStr};
}

/* 복구: ①미닫힌 문자열을 닫고 괄호 스택을 그대로 닫아보기(잘린 값 보존)
 *       ②실패 시 끝에 매달린 "값 없는 키"만 제거 후 재시도
 *       ③그래도 실패하면 마지막 구분 지점까지 잘라가며 반복 */
function repairJson(src){
  let s = String(src ?? '').trim();
  if(!s) return null;
  for(let attempt = 0; attempt < 60; attempt++){
    let t = s.replace(/[,\s]+$/, '');
    if(!t) return null;
    const st = scanState(t);
    if(st.inStr) t += '"';
    let closed = t + st.stack.slice().reverse().join('');
    try{ return JSON.parse(closed); }catch(_){}

    let t2 = t.replace(/,?\s*"(?:[^"\\]|\\.)*"\s*:\s*$/, '').replace(/[,\s]+$/, '');
    if(t2 && t2 !== t){
      const st2 = scanState(t2);
      let closed2 = t2 + (st2.inStr ? '"' : '') + st2.stack.slice().reverse().join('');
      try{ return JSON.parse(closed2); }catch(_){}
    }
    const base = (t2 && t2 !== t) ? t2 : t;
    const cut = Math.max(base.lastIndexOf(','), base.lastIndexOf('{'), base.lastIndexOf('['));
    if(cut <= 0) return null;
    s = base.slice(0, cut);
  }
  return null;
}

/* 3단: 배열 내부의 개별 객체를 하나씩 추출해 정상인 것만 수집
 *      — 깨진 토큰은 건너뛰고, 말미의 잘린 객체는 복구해서 회수 */
function extractObjectsFromArray(src){
  const s = String(src ?? '');
  const out = [];
  let i = Math.max(0, s.indexOf('['));
  for(let guard = 0; guard < 500; guard++){
    const j = s.indexOf('{', i);
    if(j < 0) break;
    const ob = extractBlock(s.slice(j), '{', '}');
    if(ob){
      let v = null;
      try{ v = JSON.parse(ob); }catch(_){ v = repairJson(ob); }
      if(v != null && typeof v === 'object'){ out.push(v); i = j + ob.length; continue; }
      i = j + 1;
    }else{
      const r = repairJson(s.slice(j));      // 끝에서 잘린 객체 회수
      if(r != null && typeof r === 'object' && !Array.isArray(r) && Object.keys(r).length){
        out.push(r); break;
      }
      i = j + 1;                             // 짝 없는 여는 괄호·빈 복구는 건너뜀
    }
  }
  return out;
}

/* 통합 진입점 — 직접 파싱 우선(§6-3-2), 실패 시에만 복구 경로.
 * 복구 순서: 요청 종류의 완전 블록 → 요청 종류 시작점부터 전체 복구
 *           → 개별 객체 부분 수집 → 반대 종류 블록 → 전체 복구 */
function parseAIJson(text, kind = 'object'){
  if(text == null) return null;
  const raw = String(text).trim();
  try{ return JSON.parse(raw); }catch(_){}
  const t = raw.replace(/```(?:json)?/gi, '\n'); // 코드펜스는 노이즈로만 취급
  const [po, pc] = kind === 'array' ? ['[',']'] : ['{','}'];
  const [so, sc] = kind === 'array' ? ['{','}'] : ['[',']'];

  const block = extractBlock(t, po, pc);
  if(block){
    try{ return JSON.parse(block); }catch(_){}
    const r = repairJson(block);
    if(r != null) return r;
  }
  const si = t.indexOf(po);
  if(si >= 0){
    const r = repairJson(t.slice(si));       // 잘린 최상위 구조 복구 (내부 배열/객체 유지)
    if(r != null){
      if(kind !== 'array') return r;
      const objs = extractObjectsFromArray(t);
      if(Array.isArray(r) && r.length >= objs.length) return r;
      if(objs.length) return objs;
      return r;
    }
  }
  const objs = extractObjectsFromArray(t);
  if(objs.length) return kind === 'array' ? objs : objs[0];
  const alt = extractBlock(t, so, sc);
  if(alt){
    try{ return JSON.parse(alt); }catch(_){}
    const r = repairJson(alt);
    if(r != null) return r;
  }
  return repairJson(t);
}

/* ==================================================================
 * §3 Firebase 설정 파서 — 순수 JSON / JS 객체 리터럴 / const 선언문

function parseFbConfig(txt){

  if(!obj) return null;
  try{ const v = JSON.parse(obj); return (v && typeof v === 'object') ? v : null; }catch(_){}
  let s = obj
    .replace(/(^|[^:])\/\/[^\n]*/g, '$1')   // "https://…" 보호: ':' 뒤의 //는 유지
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .replace(/'([^'\\]*(?:\\.[^'\\]*)*)'/g, (m,p) => '"' + p.replace(/\\'/g,"'").replace(/"/g,'\\"') + '"')
    .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
    .replace(/,\s*([}\]])/g, '$1');
  try{ const v = JSON.parse(s); return (v && typeof v === 'object') ? v : null; }catch(_){ return null; }
}
/* ==================================================================
 * §2-1 localStorage — 키 변경 금지: wm_tabs / wm_fbcfg (wm_k·wm_gk·wm_mh는 프록시 전환으로 더 이상 사용하지 않으나 기존 값은 건드리지 않음)
 * ================================================================== */

/* 저장용 클린 사본 — _exp/_aiPreview/_w/_chat 등 런타임 필드 제외 (화이트리스트) */
function cleanNodeLS(n){
  return {id:n.id, type:n.type, types:(n.types || [n.type]).slice(),
          props:(n.props || []).map(p => ({k:p.k, v:p.v})),
          name:n.name ?? '', desc:n.desc ?? '',
          x:Math.round(n.x ?? 0), y:Math.round(n.y ?? 0)};
}
function cleanEdgeLS(e){
  return {id:e.id, from:e.from, to:e.to, label:e.label ?? '', desc:e.desc ?? '',
          isParent:!!e.isParent};
}
function cleanEventLS(v){
  return {id:v.id, time:v.time ?? '', body:v.body ?? '', order:v.order ?? 0};
}
function cleanTab(t){
  return {
    id: t.id,
    title: t.title ?? '무제',
    nodes: (t.nodes||[]).filter(n => !n._aiPreview).map(cleanNodeLS),
    edges: (t.edges||[]).filter(e => !e._aiPreview).map(cleanEdgeLS),
    events: (t.events||[]).map(cleanEventLS),
    worldPrompt: t.worldPrompt ?? '',
    nodeTypes: (t.nodeTypes || DEFAULT_TYPES).map(x => ({key:x.key, label:x.label})),
    refImages: (t.refImages||[]).slice(0,3)
  };
}

function loadLocal(){
  let raw = null;
  try{ raw = localStorage.getItem('wm_tabs'); }catch(_){}
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    const arr = Array.isArray(d) ? d : (d && Array.isArray(d.tabs) ? d.tabs : null);
    if(!arr) throw new Error('bad shape');
    tabs = arr.filter(Boolean).map(t => sanitizeTab(deepCopy(t)));
    tabs.forEach(t => t.nodes.forEach(n => { n._exp = false; delete n._aiPreview; }));
    activeTabId = tabs[0]?.id ?? null;
  }catch(err){
    console.error('wm_tabs 파싱 실패', err);
    lsLoadFailed = true;   // 손상 데이터 보호: 자동 저장으로 덮어쓰지 않음
    toast('로컬 데이터를 읽지 못했습니다 — 자동 저장을 일시 중지합니다', true);
  }
}

function markDirty(){ dirtyLocal = true; }

function saveLocal(){
  if(lsLoadFailed) return;  // 원본 보호
  try{
    localStorage.setItem('wm_tabs', JSON.stringify({tabs: tabs.map(cleanTab)}));
  }catch(err){
    console.error('localStorage 저장 실패', err);
    toast('로컬 저장 실패 — 저장 공간을 확인해주세요 (참고 이미지 용량 등)', true);
  }
}

/* 변경 커밋: 로컬은 주기 저장(§8-4), Firebase는 즉시 diff 전송 */
function commit(){
  markDirty();
  recordUndo();
  fbSyncActive();
}

/* ==================================================================
 * §5-12 내보내기 / 가져오기 (데이터 계층)
 * ================================================================== */
function downloadText(name, text, type = 'application/json'){
  const blob = new Blob([text], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportJson(){
  downloadText('worldmind-export.json', JSON.stringify({tabs: tabs.map(cleanTab)}, null, 2));
  toast('worldmind-export.json 파일로 저장했습니다');
}

async function applyImport(parsed){
  tabs = parsed.tabs.filter(Boolean).map(t => sanitizeTab(deepCopy(t)));
  tabs.forEach(t => {
    t.nodes = t.nodes.filter(n => !n._aiPreview);
    t.edges = t.edges.filter(e => !e._aiPreview);
    t.nodes.forEach(n => { n._exp = false; });
  });
  if(!tabs.length) tabs = [makeDefaultTab()];
  activeTabId = tabs[0].id;
  ensureIdCounter();
  clearSel();
  lsLoadFailed = false;
  recordFullUndo();             // 로드 전 상태(내용 포함)를 구조 스택에 보존
  resetTabUndo();               // 탭 집합이 통째로 바뀌었으므로 탭별 히스토리는 폐기
  markDirty(); saveLocal();
  renderTabs(); renderAll(); zoomFit(); refreshOpenPanels();
  if(fbReady){
    await pushAllToFB();
    attachTab(activeTabId);
  }
  toast('데이터를 불러왔습니다');
}

function makeDefaultTab(){
  const t = sanitizeTab({id:gid(), title:'새 세계관', nodes:[], edges:[], events:[], worldPrompt:'', refImages:[]});
  t.nodes.push({id:gid(), type:'world', name:'새 세계', desc:'이 세계의 중심 개념을 적어보세요.', x:1900, y:1950, _exp:false});
  return t;
}
/* ==================================================================
 * §2-2 / §2-3 / §3 Firebase Realtime Database
 *  - 루트: worldmind / tabList + tabs/{tabId}/{meta,nodes,edges,events}
 *  - 개별 항목 diff 전송(set), child_* 리스너 수신, _w 에코 무시
 * ================================================================== */
let fbApp = null, fbDb = null, fbRoot = null, fbReady = false, fbAppSeq = 0;
let fbAuthed = false;                    // Firebase 편집 세션(커스텀 토큰 로그인) 여부

/* §2-4 Firebase 편집 세션 — 마스터 코드 검증에 성공하면 Worker 가 Firebase 커스텀 토큰을
   함께 내려준다. 그걸로 로그인해야 보안 규칙이 auth.token.editor 로 편집자를 식별할 수 있다.
   ⚠ Worker 에 FIREBASE_SERVICE_ACCOUNT 가 없으면 fbToken 이 오지 않고, 아래 함수들은
      조용히 아무것도 하지 않는다 — 규칙을 조이기 전까지는 지금까지처럼 동작한다. */
const fbAuthReady = () => !!fbApp && typeof firebase !== 'undefined' && !!firebase.auth;
async function fbSignIn(fbToken){
  if(!fbToken || !fbAuthReady()) return false;
  try{
    await fbApp.auth().signInWithCustomToken(fbToken);
    fbAuthed = true;
    return true;
  }catch(err){
    console.error('Firebase 편집 세션 로그인 실패', err);
    toast('Firebase 편집 권한을 얻지 못했습니다 — 저장이 막힐 수 있습니다', true);
    return false;
  }
}
async function fbSignOut(){
  fbAuthed = false;
  if(!fbAuthReady()) return;
  try{ await fbApp.auth().signOut(); }catch(_){}
}
/* 편집 토큰은 12시간이지만 Firebase 커스텀 토큰은 1시간짜리라, 새로고침·재접속 때
   Worker 에서 새로 받아 로그인한다. 로그인 뒤에는 SDK 가 알아서 세션을 갱신한다. */
async function fbRefreshSession(){
  if(!getToken() || !fbAuthReady()) return;
  try{
    const d = await apiPost('/api/fbtoken', {});
    if(d && d.fbToken) await fbSignIn(d.fbToken);
  }catch(_){ /* 503(서비스 계정 미설정) 등 — 조용히 넘어간다 */ }
}
let fbUnsubs = [];        // 활성 탭 리스너 [ref, event, cb]
let fbGlobalUnsubs = [];  // tabList / .info 리스너
let fbSnap = {meta:null, nodes:{}, edges:{}, events:{}}; // 서버에 반영된 상태 스냅샷(활성 탭)
let lastTabListJson = '';
let curAttachId = null;
let orphanSuspects = null;
const ORPHAN_GRACE_MS = 15000;
let remoteTimer = null;

function setStatus(cls, txt){
  if(!syncDotEl) return;
  syncDotEl.className = 'dot ' + cls;
  syncTxtEl.textContent = txt;
}

/* 필드 순서를 고정한 정규화 — 스냅샷 비교의 기준 */
function normFB(kind, d){
  d = d || {};
  if(kind === 'nodes')  return {type:d.type||'custom',
                                types:Array.isArray(d.types) && d.types.length ? d.types.slice() : [d.type||'custom'],
                                props:(Array.isArray(d.props) ? d.props : []).map(p => ({k:String(p.k??''), v:String(p.v??'')})),
                                name:d.name??'', desc:d.desc??'', x:Math.round(d.x||0), y:Math.round(d.y||0)};
  if(kind === 'edges')  return {from:d.from||'', to:d.to||'', label:d.label??'', desc:d.desc??'', isParent:!!d.isParent};
  return {time:d.time??'', body:d.body??'', order:d.order??0};
}
function metaFB(t){
  return {title:t.title??'무제', worldPrompt:t.worldPrompt??'',
          nodeTypes:(t.nodeTypes || DEFAULT_TYPES).map(x => ({key:x.key, label:x.label}))};
}
/* ⚠ 스냅샷 비교 키는 반드시 metaFB 를 거쳐야 한다 — 필드가 어긋나면 meta 를 무한 재전송한다 */
function metaKey(m){ return JSON.stringify(metaFB(m)); }
function objToArr(o){
  return Object.entries(o||{}).map(([id,v]) => { const {_w, ...d} = (v||{}); return {id, ...d}; });
}
function emptySnap(){ return {meta:null, nodes:{}, edges:{}, events:{}}; }

/* ---------------- 초기화 ---------------- */
async function initFB(cfg, hadLocal){
  teardownFB();
  if(!cfg){ setStatus('off','오프라인'); return; }
  setStatus('warn','연결 중…');
  try{
    fbApp = firebase.initializeApp(cfg, 'wm' + (fbAppSeq++));
    fbDb = fbApp.database();
    fbRoot = fbDb.ref('worldmind');

    const rootSnap = await fbRoot.once('value');
    let v = rootSnap.val();
    v = await migrateIfOld(v);           // §2-3 구 포맷 자동 마이그레이션

    if(v && v.tabList){
      const list = normTabList(v.tabList);
      if(!hadLocal && list.length){
        adoptAll(list, v);               // 새 브라우저: 서버 데이터 전면 채택
      }else if(list.length){
        initReconcile(list, v);          // 초기 병합: 서버+로컬 합집합(오프라인 생성분 보존)
      }
      lastTabListJson = JSON.stringify(list);
      const sv = (v && v.tabs) || {};
      orphanSuspects = list.map(x => x.id).filter(id => !sv[id]);
    }

    fbReady = true;
    /* 내용이 늦게 도착할 수 있으므로 후보는 (모드와 무관하게) 지켜보며 채운다 — 삭제는 하지 않는다 */
    (orphanSuspects || []).forEach(id => watchTabUntilFilled(id));
    sweepOrphanTabs();

    /* 연결 상태 */
    const cref = fbDb.ref('.info/connected');
    const ccb = cref.on('value', s => {
      /* ⚠ 쓰기가 막힌 상태(fbWriteBroken)면 연결이 붙어도 녹색으로 되돌리지 않는다 —
         그러지 않으면 규칙·권한 문제로 저장이 안 되는데 칩만 정상으로 보인다 */
      if(!s.val()){ setStatus('warn', '연결 중…'); return; }
      if(fbWriteBroken){ setStatus('err', '저장 실패'); return; }
      setStatus('ok', '실시간 동기화');
    });
    fbGlobalUnsubs.push([cref,'value',ccb]);

    /* 탭 목록 감시 (다른 사용자의 탭 추가/삭제) */
    const tlref = fbRoot.child('tabList');
    const tlcb = tlref.on('value', s => {
      const list = normTabList(s.val());
      const j = JSON.stringify(list);
      if(j === lastTabListJson) return;  // 자기 쓰기 에코
      lastTabListJson = j;
      applyRemoteTabList(list);
    });
    fbGlobalUnsubs.push([tlref,'value',tlcb]);
  }catch(err){
    console.error('Firebase 초기화 실패', err);
    setStatus('err','연결 오류');
    fbReady = false;
    toast('Firebase에 연결하지 못했습니다 — 이 브라우저에만 저장됩니다 (콘솔에 원인이 남습니다)', true);
  }
}

function teardownFB(){
  detachTab();
  fbGlobalUnsubs.forEach(([r,e,c]) => { try{ r.off(e,c); }catch(_){} });
  fbGlobalUnsubs = [];
  try{ if(fbApp) fbApp.delete(); }catch(_){}
  fbApp = fbDb = fbRoot = null;
  fbReady = false;
  lastTabListJson = '';
  fbSnap = emptySnap();
  setStatus('off','오프라인');
}

function normTabList(v){
  let arr = v;
  if(!arr) return [];
  if(!Array.isArray(arr)){
    arr = Object.keys(arr).sort((a,b)=>(+a)-(+b)).map(k => arr[k]);
  }
  return arr.filter(x => x && x.id).map(x => ({id:x.id, title:x.title ?? '무제'}));
}

/* §2-3: worldmind/{tabs:[...]} 배열 통짜 포맷 → 항목별 경로 구조로 손실 없이 변환 */
async function migrateIfOld(v){
  if(!v) return v;
  let oldTabs = null;
  if(Array.isArray(v.tabs)) oldTabs = v.tabs;
  else if(v.tabs && !v.tabList && typeof v.tabs === 'object'){
    const keys = Object.keys(v.tabs);
    if(keys.length && keys.every(k => /^\d+$/.test(k)))
      oldTabs = keys.sort((a,b)=>(+a)-(+b)).map(k => v.tabs[k]);
  }
  if(!oldTabs) return v;

  const tabList = [], tabsObj = {};
  oldTabs.filter(Boolean).map(t => sanitizeTab(deepCopy(t))).forEach(t => {
    tabList.push({id:t.id, title:t.title});
    const nodes = {}, edges = {}, events = {};
    t.nodes.forEach(n => { nodes[n.id] = {...normFB('nodes',n), _w:FB_SID}; });
    t.edges.forEach(e => { edges[e.id] = {...normFB('edges',e), _w:FB_SID}; });
    t.events.forEach(ev => { events[ev.id] = {...normFB('events',ev), _w:FB_SID}; });
    tabsObj[t.id] = {meta:{...metaFB(t), _w:FB_SID}, nodes, edges, events};
  });
  const nv = {tabList, tabs:tabsObj};
  await fbRoot.set(nv);
  console.info('Firebase 구 포맷 → 신규 구조 마이그레이션 완료 (' + tabList.length + '탭)');
  return nv;
}

function buildTabFromServer(id, title, v){
  const tv = (v && v.tabs && v.tabs[id]) || {};
  return sanitizeTab({
    id,
    title: tv.meta?.title ?? title,
    worldPrompt: tv.meta?.worldPrompt ?? '',
    nodeTypes: tv.meta?.nodeTypes,          // 없으면 sanitizeTab 이 기본 7종으로 채운다
    nodes: objToArr(tv.nodes).map(n => ({_exp:false, ...n})),
    edges: objToArr(tv.edges),
    events: objToArr(tv.events),
    refImages: []
  });
}

function adoptAll(list, v){
  tabs = list.map(({id,title}) => buildTabFromServer(id, title, v));
  activeTabId = tabs[0]?.id ?? null;
  markDirty();
}

/* 초기 1회 병합: 서버 목록 우선 순서, 로컬 전용 탭은 뒤에 보존 → 이후 fbSync가 push */
function initReconcile(list, v){
  const local = {}; tabs.forEach(t => local[t.id] = t);
  const next = [];
  list.forEach(({id,title}) => {
    if(local[id]){ next.push(local[id]); delete local[id]; }
    else next.push(buildTabFromServer(id, title, v));
  });
  Object.values(local).forEach(t => next.push(t));
  tabs = next;
  if(!tabs.find(t => t.id === activeTabId)) activeTabId = tabs[0]?.id ?? null;
  markDirty();
}

/* 정상 운영 중 원격 tabList 반영 — 서버 목록이 권위 */
function applyRemoteTabList(list){
  if(!list.length) return; // 빈 목록 수신은 무시(방어)
  const local = {}; tabs.forEach(t => local[t.id] = t);
  const next = [], fetches = [];
  list.forEach(({id,title}) => {
    if(local[id]){ local[id].title = title; next.push(local[id]); delete local[id]; }
    else{
      const stub = sanitizeTab({id, title, nodes:[], edges:[], events:[], worldPrompt:'', refImages:[]});
      next.push(stub); fetches.push(stub);
    }
  });
  Object.keys(local).forEach(dropTabUndo);   // 원격 목록에서 사라진 탭의 되돌리기 히스토리 폐기
  tabs = next;
  if(!tabs.find(t => t.id === activeTabId)){
    activeTabId = tabs[0]?.id ?? null;
    clearSel();
    if(activeTabId && fbReady) attachTab(activeTabId);
    zoomFitSoon();
  }
  fetches.forEach(stub => {
    const ref = fbRoot.child('tabs/' + stub.id);
    const fill = tv => {
      if(!tv) return false;
      const st = tabs.find(t => t.id === stub.id) || stub;
      st.title = tv.meta?.title ?? st.title;
      st.worldPrompt = tv.meta?.worldPrompt ?? '';
      st.nodes = objToArr(tv.nodes).map(n => ({_exp:false, ...n}));
      st.edges = objToArr(tv.edges);
      st.events = objToArr(tv.events);
      markDirty(); queueRemoteRender();
      return true;
    };
    ref.once('value').then(s => {
      if(fill(s.val())) return;
      /* ⚠ 목록 쓰기가 내용 쓰기보다 먼저 도착하는 창이 반드시 있다.
         빈 스텁을 방치(기존 버그)하지 않고, 지우지도 않고, 내용이 올 때까지 지켜본다. */
      const cb = ref.on('value', function h(s2){
        if(fill(s2.val())){ try{ ref.off('value', h); }catch(_){} }
      });
      fbGlobalUnsubs.push([ref, 'value', cb]);
    }).catch(()=>{});
  });
  markDirty(); queueRemoteRender();
}

/* 서버 tabList 에는 있는데 tabs/{id} 가 통째로 없는 '고아 항목' 정리.
   ⚠ 다른 기기가 방금 만든 탭일 수도 있으므로 (1) 유예 후 재확인 (2) 로컬 내용 보존
   (3) 읽기 실패 시 중단 (4) 전멸 방지. 로컬만 지우면 다음 fbSyncActive 가 그 축소된
   목록을 서버에 밀어 넣으므로, 서버 교정을 함께 할 수 있는 편집 모드에서만 실행한다. */

/* tabs/{id} 에 내용이 올라올 때까지 지켜보다가 도착하면 로컬 탭을 채운다 (삭제하지 않는다) */
function watchTabUntilFilled(id){
  if(!fbReady || !fbRoot) return;
  const ref = fbRoot.child('tabs/' + id);
  const cb = ref.on('value', function h(s){
    const tv = s.val(); if(!tv) return;
    const st = tabs.find(t => t.id === id);
    if(st && !(st.nodes.length || st.edges.length || st.events.length)){
      st.title = tv.meta?.title ?? st.title;
      st.worldPrompt = tv.meta?.worldPrompt ?? '';
      st.nodes = objToArr(tv.nodes).map(n => ({_exp:false, ...n}));
      st.edges = objToArr(tv.edges);
      st.events = objToArr(tv.events);
      markDirty(); queueRemoteRender();
    }
    try{ ref.off('value', h); }catch(_){}
  });
  fbGlobalUnsubs.push([ref, 'value', cb]);
}

let orphanSweeping = false;
async function sweepOrphanTabs(){
  if(orphanSweeping) return;
  if(!fbReady || !fbRoot || !editMode) return;
  if(!orphanSuspects || !orphanSuspects.length) return;
  const suspects = orphanSuspects.filter(id => {
    const lt = tabs.find(t => t.id === id);
    return !(lt && (lt.nodes.length || lt.edges.length || lt.events.length));
  });
  if(!suspects.length){ orphanSuspects = null; return; }
  orphanSweeping = true;
  try{
    await new Promise(r => setTimeout(r, ORPHAN_GRACE_MS));
    if(!fbReady || !fbRoot || !editMode) return;
    const dead = [];
    for(const id of suspects){
      let tv = null;
      try{ tv = (await fbRoot.child('tabs/' + id).once('value')).val(); }
      catch(err){ console.warn('고아 탭 재확인 실패 — 정리를 건너뜁니다', err); return; }
      const lt = tabs.find(t => t.id === id);
      if(!lt) continue;
      if(tv){
        lt.title = tv.meta?.title ?? lt.title;
        lt.worldPrompt = tv.meta?.worldPrompt ?? '';
        lt.nodes = objToArr(tv.nodes).map(nn => ({_exp:false, ...nn}));
        lt.edges = objToArr(tv.edges);
        lt.events = objToArr(tv.events);
        markDirty(); queueRemoteRender();
        continue;
      }
      if(lt.nodes.length || lt.edges.length || lt.events.length) continue;
      dead.push(id);
    }
    orphanSuspects = null;
    if(!dead.length) return;
    const next = tabs.filter(t => !dead.includes(t.id));
    if(!next.length) return;
    const prevTabs = tabs, prevActive = activeTabId, prevJson = lastTabListJson;
    tabs = next;
    if(!tabs.find(t => t.id === activeTabId)){
      activeTabId = tabs[0].id; clearSel();
      attachTab(activeTabId);
      renderAll(); zoomFit(); refreshOpenPanels();
    }
    renderTabs(); markDirty();
    const tl = tabs.map(t => ({id:t.id, title:t.title ?? '무제'}));
    lastTabListJson = JSON.stringify(tl);
    fbRoot.child('tabList').set(tl).then(fbWriteOk, err => {
      lastTabListJson = prevJson;
      tabs = prevTabs; activeTabId = prevActive;
      renderTabs(); renderAll(); refreshOpenPanels();
      fbWriteFail(err);
    });
    console.info('내용 없는 고아 탭 정리: ' + dead.join(', '));
  }finally{ orphanSweeping = false; }
}

/* ---------------- 활성 탭 리스너 ---------------- */
function detachTab(){
  fbUnsubs.forEach(([r,e,c]) => { try{ r.off(e,c); }catch(_){} });
  fbUnsubs = [];
  curAttachId = null;
}

async function attachTab(tabId, applyServer = true){
  if(!fbReady || !fbRoot) return;
  detachTab();
  const tab = tabs.find(t => t.id === tabId);
  if(!tab) return;
  curAttachId = tabId;
  /* ⚠ §5-1: 스냅샷은 항상 '서버 인지 상태'에서 출발.
     복제 직후처럼 서버가 비어 있으면 스냅샷도 비어 → 전체가 diff로 기록됨 */
  fbSnap = emptySnap();
  const tref = fbRoot.child('tabs/' + tabId);
  try{
    const s = await tref.once('value');
    if(curAttachId !== tabId) return;
    const v = s.val();
    if(v) adoptServerTab(tab, v, applyServer);   // 되돌리기 직후엔 스냅샷만 채우고 로컬을 덮지 않음
  }catch(err){ console.warn('탭 데이터 읽기 실패', err); }
  if(curAttachId !== tabId) return;

  const mref = tref.child('meta');
  const mcb = mref.on('value', s => {
    const val = s.val(); if(!val) return;
    const {_w, ...m} = val;
    const j = metaKey(m);
    if(fbSnap.meta === j) return;
    fbSnap.meta = j;
    if(_w === FB_SID) return;
    const t = tabs.find(x => x.id === tabId); if(!t) return;
    t.title = m.title ?? t.title;
    t.worldPrompt = m.worldPrompt ?? '';
    if(Array.isArray(m.nodeTypes) && m.nodeTypes.length){
      t.nodeTypes = m.nodeTypes.map(x => ({key:x.key, label:x.label}));
    }
    queueRemoteRender();
  });
  fbUnsubs.push([mref,'value',mcb]);

  ['nodes','edges','events'].forEach(kind => {
    const kref = tref.child(kind);
    [['child_added','up'],['child_changed','up'],['child_removed','rm']].forEach(([evt,mode]) => {
      const cb = kref.on(evt, s => handleRemoteItem(tabId, kind, mode, s.key, s.val()));
      fbUnsubs.push([kref, evt, cb]);
    });
  });

  fbSyncActive();       // 서버에 없는 로컬 항목 push (복제 탭 → 전량 기록)
  queueRemoteRender();
}

function adoptServerTab(tab, v, applyLocal = true){
  if(v.meta){
    const {_w, ...m} = v.meta;
    if(applyLocal){
      tab.title = m.title ?? tab.title;
      tab.worldPrompt = m.worldPrompt ?? tab.worldPrompt ?? '';
      if(Array.isArray(m.nodeTypes) && m.nodeTypes.length){
        tab.nodeTypes = m.nodeTypes.map(x => ({key:x.key, label:x.label}));
      }
    }
    fbSnap.meta = metaKey(m);
  }
  ['nodes','edges','events'].forEach(kind => {
    const src = v[kind] || {};
    Object.entries(src).forEach(([id, val]) => {
      const {_w, ...data} = (val||{});
      const norm = normFB(kind, data);
      fbSnap[kind][id] = JSON.stringify(norm);
      if(!applyLocal) return;
      const arr = tab[kind];
      const ex = arr.find(x => x.id === id);
      if(ex) Object.assign(ex, norm);
      else arr.push(kind === 'nodes' ? {id, _exp:false, ...norm} : {id, ...norm});
    });
  });
  markDirty();
}

function handleRemoteItem(tabId, kind, mode, id, val){
  if(curAttachId !== tabId) return;
  const tab = tabs.find(t => t.id === tabId); if(!tab) return;
  const arr = tab[kind];
  if(mode === 'rm'){
    const hadSnap = (id in fbSnap[kind]);
    const idx = arr.findIndex(x => x.id === id);
    if(!hadSnap && idx < 0) return;
    delete fbSnap[kind][id];
    if(idx >= 0) arr.splice(idx, 1);
    if(kind === 'nodes'){
      tab.edges = tab.edges.filter(e => {
        const gone = e.from === id || e.to === id;
        if(gone) delete fbSnap.edges[e.id];
        return !gone;
      });
      sel.nodeIds = sel.nodeIds.filter(x => x !== id);
    }
    if(kind === 'edges' && sel.edgeId === id) sel.edgeId = null;
    markDirty(); queueRemoteRender();
    return;
  }
  const {_w, ...data} = (val||{});
  const norm = normFB(kind, data);
  const j = JSON.stringify(norm);
  if(fbSnap[kind][id] === j) return;   // 이미 반영된 내용
  fbSnap[kind][id] = j;
  if(_w === FB_SID) return;            // 자기 쓰기 에코
  const ex = arr.find(x => x.id === id);
  if(ex) Object.assign(ex, norm);
  else arr.push(kind === 'nodes' ? {id, _exp:false, ...norm} : {id, ...norm});
  markDirty(); queueRemoteRender();
}

/* ---------------- 쓰기: 변경 항목만 diff 전송 (§3) ---------------- */
/* 쓰기 실패는 조용히 넘기지 않는다 — 스냅샷을 되돌려 다음 commit에서 재시도하고 사용자에게 알린다.
   (규칙·권한 문제로 서버 저장이 막히면 화면은 멀쩡한데 데이터만 로컬에 갇히기 때문) */
let fbWriteBroken = false;
function fbWriteFail(err, rollback){
  if(rollback) rollback();          // 스냅샷 롤백 → 다음 diff가 같은 항목을 다시 보낸다
  console.error('Firebase 쓰기 실패', err);
  if(fbWriteBroken) return;         // 연속 실패는 한 번만 알린다
  fbWriteBroken = true;
  setStatus('err', '저장 실패');
  toast('Firebase에 저장하지 못했습니다 — 변경 내용이 이 브라우저에만 남습니다', true);
}
function fbWriteOk(){
  if(!fbWriteBroken) return;
  fbWriteBroken = false;
  setStatus('ok', '실시간 동기화');
  toast('Firebase 저장이 복구되었습니다');
}

function fbSyncActive(){
  if(!fbReady || !fbRoot) return;
  if(!editMode) return;             // 보기 전용은 서버에 쓰지 않는다 (읽기·실시간 수신은 그대로)
  const tab = curTab(); if(!tab) return;

  /* 탭 목록 */
  const tl = tabs.map(t => ({id:t.id, title:t.title ?? '무제'}));
  const tj = JSON.stringify(tl);
  if(tj !== lastTabListJson){
    const prev = lastTabListJson;
    lastTabListJson = tj;
    fbRoot.child('tabList').set(tl).then(fbWriteOk, err => fbWriteFail(err, () => { lastTabListJson = prev; }));
  }

  if(curAttachId !== tab.id) return;   // 활성 탭 리스너 준비 후에만 항목 diff
  const tref = fbRoot.child('tabs/' + tab.id);

  const mj = metaKey(tab);
  if(fbSnap.meta !== mj){
    const prev = fbSnap.meta;
    fbSnap.meta = mj;
    tref.child('meta').set({...metaFB(tab), _w:FB_SID})
      .then(fbWriteOk, err => fbWriteFail(err, () => { fbSnap.meta = prev; }));
  }

  const kinds = [
    ['nodes',  it => !it._aiPreview],
    ['edges',  it => !it._aiPreview],
    ['events', () => true]
  ];
  kinds.forEach(([kind, keep]) => {
    const seen = {};
    tab[kind].filter(keep).forEach(it => {
      const j = JSON.stringify(normFB(kind, it));
      seen[it.id] = 1;
      if(fbSnap[kind][it.id] !== j){
        const prev = fbSnap[kind][it.id];
        fbSnap[kind][it.id] = j;
        tref.child(kind + '/' + it.id).set({...normFB(kind,it), _w:FB_SID})
          .then(fbWriteOk, err => fbWriteFail(err, () => {
            if(prev === undefined) delete fbSnap[kind][it.id]; else fbSnap[kind][it.id] = prev;
          }));
      }
    });
    Object.keys(fbSnap[kind]).forEach(id => {
      if(!seen[id]){
        const prev = fbSnap[kind][id];
        delete fbSnap[kind][id];
        tref.child(kind + '/' + id).remove()
          .then(fbWriteOk, err => fbWriteFail(err, () => { fbSnap[kind][id] = prev; }));
      }
    });
  });
}

/* 원격 수신 렌더 — 50ms 디바운스 (§3, §8-3) */
function queueRemoteRender(){
  if(remoteTimer) return;
  remoteTimer = setTimeout(() => {
    remoteTimer = null;
    renderTabs();
    scheduleRender();
    refreshOpenPanels();
  }, 50);
}

/* §5-12 로드 등 전면 교체 시: 서버 전체를 로컬 기준으로 재기록 */
async function pushAllToFB(){
  if(!fbReady || !fbRoot) return;
  try{
    const s = await fbRoot.child('tabList').once('value');
    const oldList = normTabList(s.val());
    const newIds = new Set(tabs.map(t => t.id));
    const gone = oldList.filter(({id}) => !newIds.has(id)).map(({id}) => id);
    for(const t of tabs){
      const nodes = {}, edges = {}, events = {};
      t.nodes.filter(n=>!n._aiPreview).forEach(n => { nodes[n.id] = {...normFB('nodes',n), _w:FB_SID}; });
      t.edges.filter(e=>!e._aiPreview).forEach(e => { edges[e.id] = {...normFB('edges',e), _w:FB_SID}; });
      t.events.forEach(ev => { events[ev.id] = {...normFB('events',ev), _w:FB_SID}; });
      await fbRoot.child('tabs/' + t.id).set({meta:{...metaFB(t), _w:FB_SID}, nodes, edges, events});
    }
    /* ⚠ 사라진 탭의 tabs/{id} 삭제와 tabList 갱신을 한 번의 원자적 update 로 (반쪽 상태 차단) */
    const tl = tabs.map(t => ({id:t.id, title:t.title ?? '무제'}));
    const prevJson = lastTabListJson;
    lastTabListJson = JSON.stringify(tl);
    const upd = {tabList: tl};
    gone.forEach(id => { upd['tabs/' + id] = null; });
    try{ await fbRoot.update(upd); }
    catch(e2){ lastTabListJson = prevJson; throw e2; }
    fbSnap = emptySnap();
  }catch(err){
    /* 칩까지 빨갛게 만들어야 사용자가 '서버에 안 올라갔다'는 걸 알아차린다 */
    fbWriteFail(err);
    toast('Firebase 전체 동기화에 실패했습니다 — 변경 내용이 이 브라우저에만 남습니다', true);
  }
}
/* ==================================================================
 * 캔버스 뷰포트 — 4000×4000, translate+scale, 줌 0.15~3 (§4, §9)
 * ================================================================== */
function applyView(){
  worldEl.style.transform = `translate(${view.px}px,${view.py}px) scale(${view.z})`;
}
function clampZ(z){ return Math.min(3, Math.max(0.15, z)); }

function zoomAt(sx, sy, factor){
  const nz = clampZ(view.z * factor);
  const k = nz / view.z;
  view.px = sx - (sx - view.px) * k;
  view.py = sy - (sy - view.py) * k;
  view.z = nz;
  applyView();
}
function screenToWorld(sx, sy){
  return {x:(sx - view.px) / view.z, y:(sy - view.py) / view.z};
}
function viewCenterWorld(){
  const r = wrapEl.getBoundingClientRect();
  return screenToWorld(r.width/2, r.height/2);
}

function zoomFit(){
  const tab = curTab(); if(!tab || !wrapEl) return;
  const r = wrapEl.getBoundingClientRect();
  if(!tab.nodes.length){
    view.z = 0.7;
    view.px = r.width/2 - 2000*view.z;
    view.py = r.height/2 - 2000*view.z;
    applyView(); return;
  }
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  tab.nodes.forEach(n => {
    const s = nodeSizes[n.id] || {w:200, h:70};
    const p = dispOf(n);                                    // 트윈 중에는 화면에 보이는 좌표 기준
    minX = Math.min(minX, p.x);        minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + s.w);  maxY = Math.max(maxY, p.y + s.h);
  });
  const pad = 140;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const z = clampZ(Math.min(r.width/(maxX-minX), r.height/(maxY-minY), 1.4));
  view.z = z;
  view.px = (r.width  - (maxX-minX)*z)/2 - minX*z;
  view.py = (r.height - (maxY-minY)*z)/2 - minY*z;
  applyView();
}
function zoomFitSoon(){ requestAnimationFrame(() => { renderAll(); zoomFit(); }); }

/* ==================================================================
 * 렌더 파이프라인 — 한 사이클에 노드/엣지 각 1회 (§8-2)
 * ================================================================== */
let renderQueued = false;
function scheduleRender(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderAll(); });
}
function renderAll(){
  renderNodes();
  renderEdges();
}

/* ---------------- 노드 ---------------- */
function renderNodes(){
  runCleanup();                       // §8-1 이전 렌더의 window 리스너 정리
  const tab = curTab();
  nodesEl.innerHTML = '';
  nodeSizes = {};
  if(!tab) return;
  tab.nodes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'node'
      + (searchHits.includes(n.id) ? (searchHits[searchIdx] === n.id ? ' found cur' : ' found') : '')
      + (n._exp ? ' exp' : '')
      + (isSel(n.id) ? ' sel' : '')
      + (n._aiPreview ? ' preview' : '');
    const dp = dispOf(n);
    el.style.left = (dp.x||0) + 'px';
    el.style.top  = (dp.y||0) + 'px';
    el.dataset.id = n.id;
    const tc = typeColors(tab, n.type);
    el.style.setProperty('--c', tc.border);
    el.style.setProperty('--c-bg', tc.bg);
    el.innerHTML =
      `<div class="nh">${nodeTypeLabels(tab, n).map(l => `<span class="nt">${escHtml(l)}</span>`).join('')}</div>` +
      `<div class="nn">${escHtml(n.name || '(이름 없음)')}</div>` +
      (n.props && n.props.some(p => p.v)
        ? `<div class="np">${n.props.filter(p => p.v).slice(0,4).map(p => `<span class="npi"><b>${escHtml(p.k)}</b>${escHtml(p.v)}</span>`).join('')}</div>`
        : '') +
      `<div class="nd">${escHtml(n.desc || '설명이 없습니다.').replace(/\n/g,'<br>')}</div>`;
    wireNode(el, n);
    nodesEl.appendChild(el);
    nodeSizes[n.id] = {w:el.offsetWidth || 200, h:el.offsetHeight || 70};  // 레이아웃 전/숨김 상태 방어
  });
}

function centerOf(id){
  const tab = curTab(); if(!tab) return null;
  const n = nodeById(tab, id); if(!n) return null;
  const s = nodeSizes[id] || {w:200, h:70};
  const p = dispOf(n);
  return {x:(p.x||0) + s.w/2, y:(p.y||0) + s.h/2};
}

/* ---------------- 연결선 ---------------- */
function renderEdges(){
  const tab = curTab();
  edgeSvg.innerHTML = '';
  edgeEls = {};
  if(!tab) return;
  const labels = [];
  const obs = buildObstacles();
  tab.edges.forEach(ed => {
    const A = centerOf(ed.from), B = centerOf(ed.to);
    if(!A || !B) return;
    const g = document.createElementNS(NS,'g');
    if(ed._aiPreview) g.classList.add('preview');
    if(sel.edgeId === ed.id) g.classList.add('esel');
    /* 연결선 색 모드: 출발(상위) 노드의 타입 색을 --ec로 지정.
       CSS는 var(--ec, 기본색) 폴백이라 선택 강조·AI 미리보기 규칙이 여전히 우선한다 */
    let ec = null;
    if(edgeColorMode === 'parent'){
      const ft = nodeById(tab, ed.from)?.type;
      ec = typeColors(tab, ft).border;
      g.style.setProperty('--ec', ec);
    }

    const line = document.createElementNS(NS,'path');
    line.setAttribute('class','e-line ' + (ed.isParent ? 'parent' : 'normal'));
    const hit = document.createElementNS(NS,'path');
    hit.setAttribute('class','e-hit');
    g.appendChild(line); g.appendChild(hit);

    let lbl = null;
    const isSel = sel.edgeId === ed.id;
    const lines = isSel ? [] : wrapCJK(ed.label || '', 7);
    if(lines.length){
      lbl = document.createElementNS(NS,'g');
      lbl.setAttribute('class','e-lbl');
      const charW = 12, lineH = 15;
      const w = Math.max(...lines.map(l => [...l].length)) * charW + 16;
      const h = lines.length * lineH + 9;
      const rect = document.createElementNS(NS,'rect');
      rect.setAttribute('x', -w/2); rect.setAttribute('y', -h/2);
      rect.setAttribute('width', w); rect.setAttribute('height', h);
      rect.setAttribute('rx', 7);
      lbl.appendChild(rect);
      const text = document.createElementNS(NS,'text');
      const startY = -((lines.length-1)/2) * lineH + 4;
      lines.forEach((l,i) => {
        const ts = document.createElementNS(NS,'tspan');
        ts.setAttribute('x', 0);
        ts.setAttribute('y', startY + i*lineH);
        ts.textContent = l;
        text.appendChild(ts);
      });
      lbl.appendChild(text);
      const par = document.createElementNS(NS,'g');
      if(ed._aiPreview) par.classList.add('preview');
      if(sel.edgeId === ed.id) par.classList.add('esel');
      if(ec) par.style.setProperty('--ec', ec);
      par.appendChild(lbl);
      labels.push(par);
    }

    let detail = null;
    if(isSel){
      detail = document.createElement('div');
      detail.className = 'e-detail' + (ed._aiPreview ? ' preview' : '');
      if(ec) detail.style.setProperty('--ec', ec);
      const hasDesc = !!(ed.desc && ed.desc.trim());
      detail.innerHTML =
        `<div class="ed-t">${escHtml(ed.label || '관계')}` +
        `<span class="ed-tag">${ed.isParent ? '부모 → 자식' : '일반 관계'}</span></div>` +
        `<div class="ed-d${hasDesc ? '' : ' empty-d'}">${hasDesc ? escHtml(ed.desc) : (editMode ? '설명이 없습니다. 우클릭 → 관계 편집으로 추가할 수 있어요.' : '설명이 없습니다.')}</div>`;
      if(ec && !ed._aiPreview) detail.style.borderColor = ec;
      wireEdgeDetail(detail, ed);
      nodesEl.appendChild(detail);
    }

    edgeEls[ed.id] = {line, hit, lbl, detail, ed, selWrap:g};
    setEdgeGeom(edgeEls[ed.id], A, B, obs);
    wireEdge(hit, ed);
    if(lbl) wireEdge(lbl, ed);
    edgeSvg.appendChild(g);
  });
  labels.forEach(l => edgeSvg.appendChild(l)); // 라벨을 선 위 레이어로
}

/* ---------------- 연결선 지오메트리: 곡선(노드 회피) / 직선 ---------------- */
function buildObstacles(){
  const tab = curTab(); if(!tab) return [];
  return tab.nodes.map(n => {
    const s = nodeSizes[n.id] || {w:200, h:70};
    const p = dispOf(n);
    return {id:n.id, x:(p.x||0) + s.w/2, y:(p.y||0) + s.h/2, r:Math.max(s.w, s.h)/2};
  });
}

/* 2차 베지어: 제어점 = 현 중점 + 법선×k. 곡선의 실제 최대 편차는 k/2 */
function edgePath(A, B, k){
  const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
  const nx = -dy/L, ny = dx/L;
  const mx = (A.x + B.x)/2, my = (A.y + B.y)/2;
  if(!k) return {d:`M ${A.x} ${A.y} L ${B.x} ${B.y}`, mx, my};
  const px = mx + nx*k, py = my + ny*k;
  return {d:`M ${A.x} ${A.y} Q ${px} ${py} ${B.x} ${B.y}`, mx: mx + nx*k/2, my: my + ny*k/2};
}

/* 경로 근처 노드를 피하는 완만한 굴곡값(k) 선택
   — 양쪽 방향 × 여러 굴곡 후보를 샘플링해 침범이 가장 적고 가장 완만한 것을 고른다 */
function chooseCurve(A, B, ed, obs){
  const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy);
  if(L < 40) return 0;
  const ux = dx/L, uy = dy/L, nx = -uy, ny = ux;
  const CL = 28;                                   // 노드 가장자리로부터 확보할 여유
  const base = Math.min(Math.max(L*0.06, 8), 40);  // 기본 완만한 굴곡
  const maxK = Math.min(L*0.5, 260);
  const near = [];
  for(const o of obs){
    if(o.id === ed.from || o.id === ed.to) continue;
    const px = o.x - A.x, py = o.y - A.y;
    const t = (px*ux + py*uy)/L;
    if(t < 0.05 || t > 0.95) continue;
    if(Math.abs(px*nx + py*ny) > o.r + CL + maxK/2) continue;
    near.push(o);
  }
  if(!near.length) return base;
  const STEPS = 7, SAMPLES = 10;
  let best = base, bestScore = Infinity;
  for(const sg of [1, -1]){
    for(let i = 0; i <= STEPS; i++){
      const k = sg * (base + (maxK - base) * i/STEPS);
      let pen = 0;
      for(const o of near){
        let md = Infinity;
        for(let s = 1; s < SAMPLES; s++){
          const t = s/SAMPLES, w = 2*t*(1-t);
          const cx = A.x + dx*t + nx*w*k, cy = A.y + dy*t + ny*w*k;
          const dd = Math.hypot(cx - o.x, cy - o.y) - o.r;
          if(dd < md) md = dd;
        }
        if(md < CL) pen += (CL - md);
      }
      const score = pen*10 + Math.abs(k)*0.02 + (sg < 0 ? 0.001 : 0);
      if(score < bestScore){ bestScore = score; best = k; }
    }
  }
  return best;
}

/* ---- 노드 테두리 절단: 선이 카드 뒤로 비치지 않도록 곡선을 잘라낸다 ---- */
function quadPoint(A, P, B, t){
  const u = 1 - t;
  return {x: u*u*A.x + 2*t*u*P.x + t*t*B.x, y: u*u*A.y + 2*t*u*P.y + t*t*B.y};
}
function rectFor(id){
  const tab = curTab();
  const n = tab && nodeById(tab, id);
  if(!n) return {x1:0, y1:0, x2:0, y2:0};
  const s = nodeSizes[id] || {w:200, h:70};
  const p = dispOf(n);
  return {x1:(p.x||0) - 2, y1:(p.y||0) - 2, x2:(p.x||0) + s.w + 2, y2:(p.y||0) + s.h + 2};
}
const inRect = (p, r) => p.x > r.x1 && p.x < r.x2 && p.y > r.y1 && p.y < r.y2;

/* 2차 베지어에서 노드 사각형 밖 구간 [t0,t1]만 남긴다 — 경계는 이분 탐색으로 정밀화 */
function trimQuad(A, P, B, rA, rB){
  const C = t => quadPoint(A, P, B, t);
  const N = 24, step = 1/N;
  let t0 = 0, t1 = 1;
  if(inRect(C(0), rA)){
    let lo = 0, hi = 1;
    for(let i = 1; i <= N; i++){
      const t = i*step;
      if(!inRect(C(t), rA)){ hi = t; lo = t - step; break; }
      if(i === N){ lo = hi = 1; }
    }
    for(let i = 0; i < 12; i++){ const m = (lo + hi)/2; if(inRect(C(m), rA)) lo = m; else hi = m; }
    t0 = hi;
  }
  if(inRect(C(1), rB)){
    let lo = 1, hi = 0;
    for(let i = 1; i <= N; i++){
      const t = 1 - i*step;
      if(!inRect(C(t), rB)){ hi = t; lo = t + step; break; }
      if(i === N){ lo = hi = 0; }
    }
    for(let i = 0; i < 12; i++){ const m = (lo + hi)/2; if(inRect(C(m), rB)) lo = m; else hi = m; }
    t1 = hi;
  }
  if(t1 - t0 < 0.02) return null;                 // 카드가 겹치면 선 숨김
  const D0 = C(t0), D2 = C(t1);
  const dx = (1 - t0)*(P.x - A.x) + t0*(B.x - P.x);
  const dy = (1 - t0)*(P.y - A.y) + t0*(B.y - P.y);
  return {D0, D1:{x:D0.x + (t1 - t0)*dx, y:D0.y + (t1 - t0)*dy}, D2};
}

function setEdgeGeom(refs, A, B, obs){
  let k = 0;
  if(edgeShape === 'curve'){
    k = (geomFast && refs._k != null)
      ? refs._k                                   // 드래그/트윈 중엔 굴곡값 캐시로 프레임 유지
      : (refs._k = chooseCurve(A, B, refs.ed, obs || buildObstacles()));
  }
  const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
  const P = {x:(A.x + B.x)/2 - dy/L*k, y:(A.y + B.y)/2 + dx/L*k};
  const seg = trimQuad(A, P, B, rectFor(refs.ed.from), rectFor(refs.ed.to));
  const d = seg
    ? `M ${seg.D0.x} ${seg.D0.y} Q ${seg.D1.x} ${seg.D1.y} ${seg.D2.x} ${seg.D2.y}`
    : 'M -10 -10 L -10 -10';
  refs.line.setAttribute('d', d);
  refs.hit.setAttribute('d', d);
  const mid = quadPoint(A, P, B, 0.5);
  if(refs.lbl) refs.lbl.setAttribute('transform', `translate(${mid.x},${mid.y})`);
  if(refs.detail){
    refs.detail.style.left = mid.x + 'px';
    refs.detail.style.top  = mid.y + 'px';
  }
}

/* 드래그/트윈 중 지오메트리만 갱신 (전체 재렌더 없이) */
function updateEdgesFor(nodeId){
  const tab = curTab(); if(!tab) return;
  const obs = buildObstacles();
  tab.edges.forEach(ed => {
    if(ed.from !== nodeId && ed.to !== nodeId) return;
    const refs = edgeEls[ed.id]; if(!refs) return;
    const A = centerOf(ed.from), B = centerOf(ed.to);
    if(A && B) setEdgeGeom(refs, A, B, obs);
  });
}
function updateAllEdgeGeom(){
  const obs = buildObstacles();
  Object.values(edgeEls).forEach(refs => {
    const A = centerOf(refs.ed.from), B = centerOf(refs.ed.to);
    if(A && B) setEdgeGeom(refs, A, B, obs);
  });
}
/* ==================================================================
 * §5-2 노드 상호작용 — 클릭 펼침 / 3px 드래그 / 0.5s 롱프레스
 * ================================================================== */
function wireNode(el, n){
  el.addEventListener('click', e => {
    e.stopPropagation();
    if(_justDragged){ _justDragged = false; return; }   // ⚠ 드래그 후 펼침 방지
    if(linkMode.active){ finishLink(n.id); return; }
    if(evPick.active){ togglePick(n.id); return; }      // 사건 생성 — 노드 선택 모드
    if(e.ctrlKey || e.metaKey || e.shiftKey){           // 다중 선택 토글
      sel.edgeId = null;
      sel.nodeIds = isSel(n.id) ? sel.nodeIds.filter(x => x !== n.id) : [...sel.nodeIds, n.id];
      renderAll();
      return;
    }
    sel = {nodeIds:[n.id], edgeId:null};
    n._exp = !n._exp;
    renderAll();
  });
  /* 펼친 설명이 스크롤 가능하면 휠은 내용 스크롤 (캔버스 줌 방지) */
  el.addEventListener('wheel', e => {
    if(!n._exp) return;
    const d = el.querySelector('.nd');
    if(d && d.scrollHeight > d.clientHeight) e.stopPropagation();
  }, {passive:true});
  el.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    openNodeMenu(n, e.clientX, e.clientY);
  });
  el.addEventListener('pointerdown', e => {
    if(e.button === 2) return;
    e.stopPropagation();
    closeCtx();
    const sx = e.clientX, sy = e.clientY;
    let dragging = false, longFired = false;
    let group = [], origins = {};

    /* 롱프레스 0.5s — 태블릿 메뉴 (§5-2) */
    const lp = setTimeout(() => {
      longFired = true;
      _justDragged = true;                    // 이어지는 click 억제
      endMove();                              // 진행 중 드래그 강제 해제
      try{ el.dispatchEvent(new PointerEvent('pointerup', {bubbles:true})); }catch(_){}
      try{ el.dispatchEvent(new MouseEvent('mouseup', {bubbles:true})); }catch(_){}
      openNodeMenu(n, sx, sy);
    }, 500);

    const mv = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if(Math.hypot(dx, dy) > 10) clearTimeout(lp);   // 10px 이동 → 롱프레스 취소
      if(!dragging && editMode && Math.hypot(dx, dy) > 3){
        dragging = true;
        clearTimeout(lp);
        endTweenNow();                        // 정렬 애니메이션 중이면 즉시 확정 (좌표 판정은 데이터 기준)
        /* 선택된 묶음째 이동. 선택 밖 노드를 끌면 그 노드만 선택 */
        if(!isSel(n.id)) sel = {nodeIds:[n.id], edgeId:null};
        else sel.edgeId = null;
        group = sel.nodeIds.slice();
        const tab = curTab();
        group.forEach(id => {
          const nd = nodeById(tab, id);
          if(nd) origins[id] = {x:nd.x, y:nd.y};
          const gx = nodesEl.querySelector(`[data-id="${id}"]`);
          if(gx) gx.classList.add('drag', 'sel');
        });
        geomFast = true;                      // 드래그 중 곡선 굴곡값 캐시
      }
      if(dragging){
        let wx = dx / view.z, wy = dy / view.z;
        hideGuides();
        if(ev.shiftKey){                      // Shift: 이웃 노드 중심선에 스냅 + 가이드
          const base = origins[n.id] || {x:n.x, y:n.y};
          const sn = computeSnap(n, base.x + wx, base.y + wy, group);
          wx += sn.dx; wy += sn.dy;
        }
        const tab = curTab();
        group.forEach(id => {
          const nd = nodeById(tab, id);
          const o = origins[id];
          if(!nd || !o) return;
          nd.x = o.x + wx; nd.y = o.y + wy;
          const gx = nodesEl.querySelector(`[data-id="${id}"]`);
          if(gx){ gx.style.left = nd.x + 'px'; gx.style.top = nd.y + 'px'; }
        });
        if(group.length === 1) updateEdgesFor(n.id);
        else updateAllEdgeGeom();
      }
    };
    function endMove(){
      clearTimeout(lp);
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', endMove);
      window.removeEventListener('pointercancel', endMove);
      geomFast = false;
      hideGuides();
      group.forEach(id => nodesEl.querySelector(`[data-id="${id}"]`)?.classList.remove('drag'));
      el.classList.remove('drag');
      if(dragging && !longFired){
        _justDragged = true;
        const tab = curTab();
        group.forEach(id => {
          const nd = nodeById(tab, id);
          if(nd){ nd.x = Math.round(nd.x); nd.y = Math.round(nd.y); }
        });
        commit();
        renderEdges();
      }
      dragging = false;
    }
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', endMove);
    window.addEventListener('pointercancel', endMove);
    /* §8-1: 재렌더 시 남은 리스너 강제 정리 */
    cleanupFns.push(() => {
      clearTimeout(lp);
      geomFast = false;
      hideGuides();
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', endMove);
      window.removeEventListener('pointercancel', endMove);
    });
  });
}

/* Shift 드래그 정렬 스냅 — 근처 노드 중심선(x/y)에 흡착, 가이드선 표시 */
function computeSnap(n, px, py, group){
  const tab = curTab();
  const s = nodeSizes[n.id] || {w:200, h:70};
  const cx = px + s.w/2, cy = py + s.h/2;
  const th = Math.min(30, Math.max(4, 9 / view.z));
  const out = {dx:0, dy:0};
  let bx = th, by = th, gx = null, gy = null;
  tab.nodes.forEach(o => {
    if(group.includes(o.id) || o._aiPreview) return;
    const os = nodeSizes[o.id] || {w:200, h:70};
    const ox = o.x + os.w/2, oy = o.y + os.h/2;
    if(Math.abs(ox - cx) < bx){ bx = Math.abs(ox - cx); out.dx = ox - cx; gx = ox; }
    if(Math.abs(oy - cy) < by){ by = Math.abs(oy - cy); out.dy = oy - cy; gy = oy; }
  });
  if(gx != null){ guideV.style.left = gx + 'px'; guideV.hidden = false; }
  if(gy != null){ guideH.style.top = gy + 'px'; guideH.hidden = false; }
  return out;
}
function hideGuides(){
  if(guideV) guideV.hidden = true;
  if(guideH) guideH.hidden = true;
}

/* 엣지 클릭/우클릭/롱프레스 (§5-3) — 클릭 시 상세 카드 토글 */
function wireEdge(el, ed){
  el.addEventListener('click', e => {
    e.stopPropagation();
    if(_justDragged){ _justDragged = false; return; }
    sel = (sel.edgeId === ed.id) ? {nodeIds:[], edgeId:null} : {nodeIds:[], edgeId:ed.id};
    renderAll();
  });
  el.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    openEdgeMenu(ed, e.clientX, e.clientY);
  });
  attachPress(el, (x,y) => openEdgeMenu(ed, x, y));
}

/* 상세 카드: 다시 클릭하면 원래 라벨로 복귀, 우클릭/롱프레스는 메뉴 */
function wireEdgeDetail(el, ed){
  el.addEventListener('click', e => {
    e.stopPropagation();
    if(_justDragged){ _justDragged = false; return; }
    sel = {nodeIds:[], edgeId:null};
    renderAll();
  });
  el.addEventListener('pointerdown', e => { if(e.button !== 2) e.stopPropagation(); });
  el.addEventListener('wheel', e => {               // 긴 설명 스크롤 중엔 캔버스 줌 방지
    const d = el.querySelector('.ed-d');
    if(d && d.scrollHeight > d.clientHeight) e.stopPropagation();
  }, {passive:true});
  el.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    openEdgeMenu(ed, e.clientX, e.clientY);
  });
  attachPress(el, (x,y) => openEdgeMenu(ed, x, y));
}

/* 범용 롱프레스 (0.5s / 10px 취소) */
function attachPress(el, onLong){
  el.addEventListener('pointerdown', e => {
    if(e.button === 2) return;
    const sx = e.clientX, sy = e.clientY;
    const lp = setTimeout(() => { _justDragged = true; cleanup(); onLong(sx, sy); }, 500);
    const mv = ev => { if(Math.hypot(ev.clientX-sx, ev.clientY-sy) > 10) cleanup(); };
    const up = () => cleanup();
    function cleanup(){
      clearTimeout(lp);
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', up);
    }
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', up);
    cleanupFns.push(cleanup);
  });
}

/* ==================================================================
 * 컨텍스트 메뉴
 * ================================================================== */
function openCtx(items, x, y){
  const list = items.filter(it => editMode || (!it.eo));
  while(list[0]?.sep) list.shift();
  while(list[list.length-1]?.sep) list.pop();
  const norm = [];
  list.forEach(it => { if(it.sep && norm[norm.length-1]?.sep) return; norm.push(it); });
  if(!norm.length) return;

  ctxEl.innerHTML = '';
  norm.forEach(it => {
    if(it.sep){
      const d = document.createElement('div'); d.className = 'cm-sep';
      ctxEl.appendChild(d); return;
    }
    const b = document.createElement('button');
    b.className = 'cm-i' + (it.danger ? ' danger' : '');
    b.textContent = it.t;
    b.onclick = () => { closeCtx(); it.cb(); };
    ctxEl.appendChild(b);
  });
  ctxEl.hidden = false;
  ctxEl.style.left = '0px'; ctxEl.style.top = '0px';
  const r = ctxEl.getBoundingClientRect();
  ctxEl.style.left = Math.max(4, Math.min(x, innerWidth  - r.width  - 8)) + 'px';
  ctxEl.style.top  = Math.max(4, Math.min(y, innerHeight - r.height - 8)) + 'px';
}
function closeCtx(){ ctxEl.hidden = true; }

function openNodeMenu(n, x, y){
  openCtx([
    {t:'✏️ 노드 편집',        eo:true, cb:() => openNodeModal(n)},
    {t:'🔗 관계 추가  (Alt)', eo:true, cb:() => startLink(n.id)},
    {t:'🧭 주인공 방문',               cb:() => openVisitModal(n)},
    {sep:true},
    {t:'💡 현재 노드 추천',            cb:() => openRecNode(n)},
    {t:'🌱 하위 노드 AI 추천',          cb:() => openRecChildren(n)},
    {sep:true},
    {t:'🗑 삭제  (Del)',      eo:true, danger:true, cb:() => askDeleteNode(n)}
  ], x, y);
}
function openEdgeMenu(ed, x, y){
  openCtx([
    {t:'✏️ 관계 편집',   eo:true, cb:() => openEdgeModal(ed)},
    {t:'💡 관계 AI 추천',         cb:() => openRecEdge(ed)},
    {sep:true},
    {t:'🗑 삭제',        eo:true, danger:true, cb:() => askDeleteEdge(ed)}
  ], x, y);
}

/* ==================================================================
 * 노드 / 관계 편집 모달
 * ================================================================== */
function openNodeModal(node, presetPos){
  if(!reqEdit()) return;
  const isNew = !node;
  const tab = curTab();
  const list = typeList(tab);
  /* 주 타입은 맨 앞. 색·정렬이 이 값을 쓰므로 항상 하나는 있어야 한다 */
  let types = isNew ? [list[list.length - 1].key] : nodeTypes(node).slice();
  let props = isNew ? [] : (node.props || []).map(p => ({...p}));
  const ov = openModal({
    title: isNew ? '노드 추가' : '노드 편집', wide:true,
    body: `
      <div><label>주 타입 <span class="hint-inline">색과 정렬 기준</span></label><select id="nmType">
        ${list.map(ty => `<option value="${escHtml(ty.key)}">${escHtml(ty.label)}</option>`).join('')}
      </select></div>
      <div><label>추가 타입 <span class="hint-inline">여러 개를 겸할 수 있습니다</span></label>
        <div id="nmTypes" class="chips"></div></div>
      <div><label>이름</label><input id="nmName" maxlength="60" placeholder="예: 은빛 탑"></div>
      <div><label>속성 <span class="hint-inline">나이·소속처럼 항목으로 관리할 값</span></label>
        <div id="nmProps"></div>
        <button class="btn" id="nmPropAdd" style="width:100%;margin-top:4px">+ 속성 추가</button></div>
      <div><label>설명</label><textarea id="nmDesc" rows="5" placeholder="이 요소에 대한 설정을 적어주세요"></textarea></div>`,
    footer: `<button class="btn" data-a="c">취소</button><button class="btn pri" data-a="s">저장</button>`
  });
  ov.querySelector('#nmName').value = node?.name || '';
  ov.querySelector('#nmDesc').value = node?.desc || '';
  ov.querySelector('#nmType').value = types[0];

  const chipsEl = ov.querySelector('#nmTypes');
  const propsEl = ov.querySelector('#nmProps');
  const syncProps = () => {
    propsEl.querySelectorAll('.prop-row').forEach((r, i) => {
      if(!props[i]) return;
      props[i].k = r.querySelector('.pk').value;
      props[i].v = r.querySelector('.pv').value;
    });
  };
  const drawChips = () => {
    const primary = ov.querySelector('#nmType').value;
    chipsEl.innerHTML = list.filter(ty => ty.key !== primary).map(ty =>
      `<button class="chip${types.includes(ty.key) ? ' on' : ''}" data-k="${escHtml(ty.key)}">${escHtml(ty.label)}</button>`).join('');
  };
  const drawProps = () => {
    propsEl.innerHTML = props.map((p, i) =>
      `<div class="prop-row">` +
        `<input class="pk" placeholder="항목" maxlength="24" value="${escHtml(p.k)}">` +
        `<input class="pv" placeholder="값" maxlength="300" value="${escHtml(p.v)}">` +
        `<button class="ty-btn dngr" data-i="${i}" title="삭제">×</button>` +
      `</div>`).join('');
  };
  /* 타입이 정의한 기본 속성 중 아직 없는 것을 빈칸으로 깔아준다 */
  const applyTemplate = () => {
    syncProps();
    let added = 0;
    types.forEach(k => typeFields(tab, k).forEach(f => {
      if(!props.some(p => p.k === f)){ props.push({k:f, v:''}); added++; }
    }));
    if(added) drawProps();
  };
  drawChips(); drawProps(); applyTemplate();

  ov.querySelector('#nmType').onchange = e => {
    types = [e.target.value, ...types.filter(k => k !== e.target.value)];
    drawChips(); applyTemplate();
  };
  chipsEl.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    const k = b.dataset.k;
    types = types.includes(k) ? types.filter(x => x !== k) : [...types, k];
    drawChips(); applyTemplate();
  });
  propsEl.addEventListener('click', e => {
    const b = e.target.closest('.ty-btn'); if(!b) return;
    syncProps();
    props.splice(+b.dataset.i, 1);
    drawProps();
  });
  ov.querySelector('#nmPropAdd').onclick = () => {
    syncProps();
    props.push({k:'', v:''});

/* ==================================================================
 * 삭제 — 노드는 자식 처리 선택 (§5-2)
 * ================================================================== */
function childIdsOf(id){
  const t = curTab();
  const ids = new Set(t.nodes.map(n => n.id));
  return t.edges.filter(e => e.isParent && e.from === id && ids.has(e.to)).map(e => e.to);
}
function descendantsOf(id){
  const out = [], seen = new Set([id]);
  const q = [...childIdsOf(id)];
  while(q.length){
    const c = q.shift();
    if(seen.has(c)) continue;
    seen.add(c); out.push(c);
    q.push(...childIdsOf(c));
  }
  return out;
}
/* 커서가 캔버스 위면 그 지점, 아니면 화면 중앙 (§5-2 단축키) */
function pointerWorld(){
  return lastPointer ? screenToWorld(lastPointer.x, lastPointer.y) : viewCenterWorld();
}
/* 모달·배너·컨텍스트 메뉴·AI 미리보기가 떠 있으면 캔버스 단축키를 삼키지 않는다 */

      || (ctxEl && !ctxEl.hidden) || (aiPanelEl && !aiPanelEl.hidden);
