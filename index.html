}
/* Delete 키 — 선택이 여러 개면 한 번에 확인받는다 (하위 노드는 남긴다) */
function askDeleteSelection(){
  if(!reqEdit()) return;
  const t = curTab(); if(!t) return;
  const ids = sel.nodeIds.filter(id => nodeById(t, id));
  if(ids.length === 1){ askDeleteNode(nodeById(t, ids[0])); return; }
  if(ids.length > 1){
    confirmModal({
      title:'노드 삭제', danger:true, ok:`${ids.length}개 삭제`,
      html:`선택한 노드 <b>${ids.length}개</b>를 삭제할까요?<br>` +
           `<span style="color:var(--text3)">연결된 관계도 함께 삭제됩니다. 선택하지 않은 하위 노드는 남습니다.</span>`,
      onOk:() => doDeleteNodes(ids)
    });
    return;
  }
  const ed = sel.edgeId && t.edges.find(x => x.id === sel.edgeId);
  if(ed) askDeleteEdge(ed);
}
function doDeleteNodes(ids){
  const t = curTab();
  const set = new Set(ids);
  t.nodes = t.nodes.filter(n => !set.has(n.id));
  t.edges = t.edges.filter(e => !set.has(e.from) && !set.has(e.to));
  sel.nodeIds = sel.nodeIds.filter(id => !set.has(id));
  if(sel.edgeId && !t.edges.some(e => e.id === sel.edgeId)) sel.edgeId = null;   // 사라진 관계가 선택에 남지 않게
  commit(); renderAll();
  toast('삭제했습니다');
}
function askDeleteNode(n){
  if(!reqEdit()) return;
  const kids = childIdsOf(n.id);
  if(!kids.length){

      onOk:() => doDeleteNodes([n.id])
    });

  }
  const ov = openModal({

    body:`"<b>${escHtml(n.name)}</b>" 아래에 하위 노드 <b>${descendantsOf(n.id).length}개</b>가 연결되어 있습니다.
      <div class="infobox"><b>함께 삭제</b> — 모든 하위 노드를 재귀적으로 삭제합니다<br>

    footer:`<button class="btn" data-a="c">취소</button>
            <button class="btn" data-a="u">관계만 해제</button>

  ov.querySelector('[data-a=u]').onclick = () => { closeModal(ov); doDeleteNodes([n.id]); };
  ov.querySelector('[data-a=d]').onclick = () => { closeModal(ov); doDeleteNodes([n.id, ...descendantsOf(n.id)]); };

function askDeleteEdge(ed){
  if(!reqEdit()) return;
  const t = curTab();
  const fn = nodeById(t, ed.from)?.name ?? '?';

}

/* ==================================================================
 * 캔버스 팬/줌/배경 클릭 (bindStaticUI에서 호출)
 * ================================================================== */
function bindCanvasEvents(){
  wrapEl.addEventListener('wheel', e => {
    e.preventDefault();
    const r = wrapEl.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.13 : 1/1.13);
  }, {passive:false});

  wrapEl.addEventListener('contextmenu', e => e.preventDefault());

  /* Tab 노드 생성 위치용 — 캔버스 위 커서 좌표를 기억한다 */
  wrapEl.addEventListener('pointermove', e => {
    const r = wrapEl.getBoundingClientRect();
    lastPointer = {x: e.clientX - r.left, y: e.clientY - r.top};
  });
  wrapEl.addEventListener('pointerleave', () => { lastPointer = null; });

  wrapEl.addEventListener('pointerdown', e => {
    if(e.target !== wrapEl && e.target !== worldEl && e.target !== edgeSvg) return;
    if(e.button === 2) return;
    closeCtx();
    /* 편집 모드 + Ctrl(⌘)+마우스 좌클릭(Space 미사용) → 드래그 다중 선택(마퀴). 그 외(수식키 없음·보기 모드·터치·휠클릭·Space) → 팬 */
    const useMarquee = editMode && e.pointerType !== 'touch' && e.button === 0 && (e.ctrlKey || e.metaKey) && !spaceHeld;
    if(useMarquee) startMarquee(e);
    else startPan(e);
  });

  function startPan(e){
    if(e.button === 1) e.preventDefault();
    const sx = e.clientX, sy = e.clientY, opx = view.px, opy = view.py;
    let moved = false;
    wrapEl.classList.add('panning');
    const mv = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if(Math.hypot(dx, dy) > 3) moved = true;
      view.px = opx + dx; view.py = opy + dy;
      applyView();
    };
    const up = () => {
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', up);
      wrapEl.classList.remove('panning');
      if(!moved) bgClickClear();
    };
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', up);
    cleanupFns.push(() => {
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', up);
      wrapEl.classList.remove('panning');
    });
  }

  function startMarquee(e){
    endTweenNow();                            // 히트 판정은 데이터 좌표 기준 — 먼저 화면을 확정한다
    const r0 = wrapEl.getBoundingClientRect();
    const sx = e.clientX - r0.left, sy = e.clientY - r0.top;
    let moved = false;
    const mv = ev => {
      const x = ev.clientX - r0.left, y = ev.clientY - r0.top;
      if(Math.hypot(x - sx, y - sy) > 3) moved = true;
      marqueeEl.hidden = false;
      marqueeEl.style.left = Math.min(sx, x) + 'px';
      marqueeEl.style.top = Math.min(sy, y) + 'px';
      marqueeEl.style.width = Math.abs(x - sx) + 'px';
      marqueeEl.style.height = Math.abs(y - sy) + 'px';
    };
    const up = ev => {
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', up);
      marqueeEl.hidden = true;
      if(!moved) return;                    // Ctrl+클릭(무이동)은 선택 유지 — 누적 중 실수로 지워지지 않게
      const x = ev.clientX - r0.left, y = ev.clientY - r0.top;
      const a = screenToWorld(Math.min(sx, x), Math.min(sy, y));
      const b = screenToWorld(Math.max(sx, x), Math.max(sy, y));
      const tab = curTab(); if(!tab) return;
      const hit = tab.nodes.filter(nd => {
        const ns = nodeSizes[nd.id] || {w:200, h:70};
        return nd.x < b.x && nd.x + ns.w > a.x && nd.y < b.y && nd.y + ns.h > a.y;
      }).map(nd => nd.id);
      sel = {nodeIds:[...new Set([...sel.nodeIds, ...hit])], edgeId:null};   // 기존 선택에 합집합 누적(Ctrl+클릭과 같은 '추가' 의미)
      renderAll();
      if(evPick.active) updatePickBanner();
    };
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', up);
    cleanupFns.push(() => {
      window.removeEventListener('pointermove', mv);
      window.removeEventListener('pointerup', up);
      marqueeEl.hidden = true;
    });
  }

  function bgClickClear(){
    if(sel.nodeIds.length || sel.edgeId){
      clearSel();
      renderAll();
      if(evPick.active) updatePickBanner();
    }
  }
}
/* ==================================================================
 * §5-14 노드 검색 — 이름·설명에서 찾아 강조하고 ↑↓ 로 옮겨 다닌다
 * ================================================================== */
function openSearch(){
  const bar = $('#searchBar'); if(!bar) return;
  bar.hidden = false;
  const inp = $('#searchInput');
  inp.focus(); inp.select();
}
function closeSearch(){
  const bar = $('#searchBar'); if(!bar) return;
  bar.hidden = true;
  searchHits = []; searchIdx = -1;
  updateSearchUI();
  renderNodes();                      // 강조 클래스 제거
}
function runSearch(q){
  const tab = curTab();
  const t = String(q || '').trim().toLowerCase();
  searchHits = (!t || !tab) ? [] : tab.nodes.filter(n => !n._aiPreview && (
      String(n.name || '').toLowerCase().includes(t) ||
      String(n.desc || '').toLowerCase().includes(t)
    )).map(n => n.id);
  searchQuery = t;
  searchIdx = searchHits.length ? 0 : -1;
  updateSearchUI();
  renderNodes();
  if(searchIdx >= 0) centerOnNode(searchHits[0]);
  else if(t) toast('찾는 노드가 없습니다');
}
function stepSearch(d){
  if(!searchHits.length) return;
  searchIdx = (searchIdx + d + searchHits.length) % searchHits.length;
  updateSearchUI();
  renderNodes();
  centerOnNode(searchHits[searchIdx]);
}
function updateSearchUI(){
  const c = $('#searchCount'); if(!c) return;
  c.textContent = searchHits.length ? (searchIdx + 1) + ' / ' + searchHits.length : '0';
  const off = searchHits.length < 2;
  $('#searchPrev').disabled = off;
  $('#searchNext').disabled = off;
}
/* 줌은 그대로 두고 해당 노드가 화면 중앙에 오도록 팬 */
function centerOnNode(id){
  const c = centerOf(id); if(!c || !wrapEl) return;
  const r = wrapEl.getBoundingClientRect();
  view.px = r.width / 2 - c.x * view.z;
  view.py = r.height / 2 - c.y * view.z;
  applyView();
}

/* ==================================================================
 * §5-15 선택 영역 복사 — Ctrl+C 는 두 가지를 동시에 한다
 *   ① 시스템 클립보드에 PNG(배경 투명)  → 다른 앱에 그림으로 붙여넣기
 *   ② 앱 내부 버퍼에 노드·관계          → Ctrl+V 로 커서 위치에 붙여넣기
 * 관계는 양 끝이 모두 선택에 포함된 것만 가져간다(밖으로 나가는 선은 버린다).
 * ================================================================== */
function selectedNodes(tab){
  const ids = new Set(sel.nodeIds);
  return tab.nodes.filter(n => ids.has(n.id) && !n._aiPreview);
}
function sizeOf(id){ const s = nodeSizes[id]; return (s && s.w) ? s : {w:200, h:70}; }

function copySelection(){
  endTweenNow();                    // 좌표를 그대로 복사한다 — 정렬 애니메이션 중이면 먼저 확정
  const tab = curTab(); if(!tab) return false;
  const picked = selectedNodes(tab);
  if(!picked.length){ toast("복사할 노드를 먼저 선택하세요", true); return false; }
  const ids = new Set(picked.map(n => n.id));
  const edges = tab.edges.filter(e => !e._aiPreview && ids.has(e.from) && ids.has(e.to));
  clipBuf = {
    nodes: picked.map(n => ({srcId:n.id, type:n.type, typeLabel:typeLabel(tab, n.type),
                             name:n.name, desc:n.desc, x:n.x, y:n.y})),
    edges: edges.map(e => ({from:e.from, to:e.to, label:e.label, desc:e.desc, isParent:!!e.isParent}))
  };
  toast(`노드 ${picked.length}개 · 관계 ${edges.length}개를 복사했습니다`);
  copySelectionImage(tab, picked, edges);      // 이미지가 실패해도 내부 복사는 이미 끝나 있다
  return true;
}

/* 붙여넣을 탭에 같은 key 가 없으면 같은 이름의 타입으로, 그것도 없으면 최하위로 */
function resolveClipType(tab, n){
  const l = typeList(tab);
  if(l.some(t => t.key === n.type)) return n.type;
  const byLabel = l.find(t => t.label === n.typeLabel);
  return byLabel ? byLabel.key : l[l.length - 1].key;
}

function pasteClip(){
  if(!reqEdit()) return false;
  if(!clipBuf || !clipBuf.nodes.length){ toast("복사한 노드가 없습니다", true); return false; }
  const tab = curTab(); if(!tab) return false;
  /* 선택 묶음의 중심이 커서에 오도록 통째로 평행이동한다 */
  const xs = clipBuf.nodes.map(n => n.x), ys = clipBuf.nodes.map(n => n.y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2 + 100;
  const cy = (Math.min(...ys) + Math.max(...ys)) / 2 + 35;
  const p = lastPointer ? screenToWorld(lastPointer.x, lastPointer.y) : {x:cx + 40, y:cy + 40};
  const dx = p.x - cx, dy = p.y - cy;
  const map = {};
  const added = clipBuf.nodes.map(n => {
    const nn = {id:gid(), type:resolveClipType(tab, n), name:n.name, desc:n.desc,
                x:Math.round(n.x + dx), y:Math.round(n.y + dy), _exp:false};
    map[n.srcId] = nn.id;
    tab.nodes.push(nn);
    return nn;
  });
  clipBuf.edges.forEach(e => {
    const f = map[e.from], t = map[e.to];
    if(f && t) tab.edges.push({id:gid(), from:f, to:t, label:e.label, desc:e.desc, isParent:!!e.isParent});
  });
  sel = {nodeIds:added.map(n => n.id), edgeId:null};   // 바로 드래그로 옮길 수 있도록 선택 상태로
  commit(); renderAll();
  toast(`노드 ${added.length}개를 붙여넣었습니다`);
  return true;
}

/* ---- PNG 렌더 — 카드는 직접 그리고, 연결선은 화면 SVG 경로를 그대로 재현한다 ---- */
function drawRoundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapLines(ctx, text, maxW){
  const out = [];
  let line = "";
  for(const ch of String(text ?? "")){
    if(ch === "\n"){ out.push(line); line = ""; continue; }
    const t = line + ch;
    if(line && ctx.measureText(t).width > maxW){ out.push(line); line = ch; }
    else line = t;
  }
  if(line) out.push(line);
  return out;
}
function downloadBlob(name, blob){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function copySelectionImage(tab, picked, edges){
  try{
    if(typeof document.createElement("canvas").getContext !== "function") return;
    const SCALE = 2, PAD = 26, R = 12;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    picked.forEach(n => {
      const sz = sizeOf(n.id);
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + sz.w); maxY = Math.max(maxY, n.y + sz.h);
    });
    minX -= PAD; minY -= PAD; maxX += PAD; maxY += PAD;
    const W = Math.max(1, Math.round(maxX - minX)), H = Math.max(1, Math.round(maxY - minY));
    if(W * H > 36000000){ toast("선택 범위가 너무 넓어 이미지를 만들지 못했습니다", true); return; }
    const cv = document.createElement("canvas");
    cv.width = W * SCALE; cv.height = H * SCALE;
    const ctx = cv.getContext("2d"); if(!ctx) return;
    ctx.scale(SCALE, SCALE);
    ctx.translate(-minX, -minY);
    ctx.fillStyle = SHOT.bg;                // 흰 배경 — 문서·메신저에 붙였을 때 그대로 읽힌다
    ctx.fillRect(minX, minY, W, H);
    const textCol = SHOT.text, text2Col = SHOT.text2, bg2Col = SHOT.bg;

    /* 연결선 — 화면에 그려진 d 속성(M x y Q cx cy x y)을 그대로 재현 */
    ctx.lineWidth = 1.6; ctx.lineCap = "round";
    edges.forEach(ed => {
      const refs = edgeEls[ed.id]; if(!refs || !refs.line) return;
      const d = refs.line.getAttribute("d") || "";
      const m = d.match(/M\s*(-?[\d.]+)\s+(-?[\d.]+)\s*Q\s*(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+)/);
      if(!m) return;
      const x0 = +m[1], y0 = +m[2], qx = +m[3], qy = +m[4], x1 = +m[5], y1 = +m[6];
      ctx.strokeStyle = (edgeColorMode === "parent")
        ? typeColorsLightAt(typeIndexOf(tab, nodeById(tab, ed.from)?.type)).border
        : SHOT.edge;
      ctx.setLineDash(ed.isParent ? [] : [5, 4]);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(qx, qy, x1, y1); ctx.stroke();
      ctx.setLineDash([]);
      if(ed.label){
        const lx = 0.25*x0 + 0.5*qx + 0.25*x1;
        const ly = 0.25*y0 + 0.5*qy + 0.25*y1;
        ctx.font = "500 11px 'Noto Sans KR', sans-serif";
        const tw = ctx.measureText(ed.label).width;
        ctx.fillStyle = bg2Col;
        drawRoundRect(ctx, lx - tw/2 - 5, ly - 9, tw + 10, 18, 7); ctx.fill();
        ctx.fillStyle = text2Col; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(ed.label, lx, ly);
        ctx.textAlign = "left";
      }
    });

    /* 노드 카드 */
    picked.forEach(n => {
      const sz = sizeOf(n.id);
      const tc = typeColorsLightAt(typeIndexOf(tab, n.type));   // 화면 테마와 무관하게 라이트 색
      ctx.fillStyle = tc.bg; ctx.strokeStyle = tc.border; ctx.lineWidth = 1.5;
      drawRoundRect(ctx, n.x, n.y, sz.w, sz.h, R);
      ctx.fill(); ctx.stroke();
      ctx.textBaseline = "top";
      ctx.font = "400 10px 'Noto Sans KR', sans-serif";
      ctx.fillStyle = text2Col;
      ctx.fillText(typeLabel(tab, n.type), n.x + 12, n.y + 11);
      ctx.font = "500 13.5px 'Noto Sans KR', sans-serif";
      ctx.fillStyle = textCol;
      let ty = n.y + 28;
      wrapLines(ctx, n.name || "(이름 없음)", sz.w - 24).forEach(ln => {
        if(ty < n.y + sz.h - 6){ ctx.fillText(ln, n.x + 12, ty); ty += 18; }
      });
      if(n._exp && n.desc){
        ctx.font = "400 12px 'Noto Sans KR', sans-serif";
        ctx.fillStyle = text2Col;
        ty += 4;
        wrapLines(ctx, n.desc, sz.w - 24).forEach(ln => {
          if(ty < n.y + sz.h - 6){ ctx.fillText(ln, n.x + 12, ty); ty += 16; }
        });
      }
    });

    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    if(!blob) return;
    try{
      await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
      toast("이미지도 클립보드에 담았습니다 (흰 배경)");
    }catch(err){
      /* HTTPS 가 아니거나 브라우저가 막는 경우(Firefox 등) → 파일로 내려준다 */
      downloadBlob("worldmind-선택.png", blob);
      toast("클립보드 이미지가 막혀 PNG 파일로 저장했습니다");
    }
  }catch(err){
    console.error("선택 영역 이미지 만들기 실패", err);
    toast("이미지를 만들지 못했습니다 (노드 복사는 완료)", true);
  }
}

/* ==================================================================
 * §5-16 노드 가져오기 — 문서/drawio 를 AI 로 노드·관계로 변환해 바로 추가
 *   · drawio(mxGraph XML)는 구조가 확정적이라 코드로 파싱하고 AI 는 타입만 배정
 *   · 일반 문서는 AI 가 노드·관계·타입을 모두 판별
 *   · 미리보기 없이 바로 추가하고 Ctrl+Z 로 되돌린다(요청 사양)
 * ================================================================== */
const IMPORT_MAX_CHARS = 40000;

/* drawio 압축 본문(base64 + deflate-raw + URI 인코딩) 풀기 */
async function inflateDrawio(b64){
  try{
    if(typeof DecompressionStream === "undefined") return null;
    const bin = Uint8Array.from(atob(b64.replace(/\s+/g, "")), c => c.charCodeAt(0));
    const ds = new DecompressionStream("deflate-raw");
    const buf = await new Response(new Blob([bin]).stream().pipeThrough(ds)).arrayBuffer();
    return decodeURIComponent(new TextDecoder().decode(buf));
  }catch(_){ return null; }
}
function stripTags(v){
  return String(v ?? "").replace(/<br\s*\/?>/gi, " ").replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ")
    .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/\s+/g, " ").trim();
}

/* mxGraph XML → {nodes:[{name,desc}], edges:[{from,to,label}]} (이름 기준) */
async function parseDrawio(text){
  let xml = text;
  const dm = text.match(/<diagram[^>]*>([\s\S]*?)<\/diagram>/);
  if(dm){
    const inner = dm[1].trim();
    if(!inner.includes("<")){                       // 압축본
      const un = await inflateDrawio(inner);
      if(!un) return {error:"압축된 drawio 파일입니다. drawio 에서 [파일 → 다른 이름으로 저장]에서 압축을 끄고 다시 시도해주세요."};
      xml = un;
    }else xml = inner;
  }
  let doc;
  try{ doc = new DOMParser().parseFromString(xml, "text/xml"); }catch(_){ return {error:"XML 을 읽지 못했습니다."}; }
  const cells = Array.from(doc.getElementsByTagName("mxCell"));
  if(!cells.length) return {error:"drawio 도형을 찾지 못했습니다."};
  const byId = {}, nodes = [], edges = [];
  cells.forEach(c => {
    const id = c.getAttribute("id");
    const val = stripTags(c.getAttribute("value"));
    if(c.getAttribute("vertex") === "1" && val){ byId[id] = val; nodes.push({name:val, desc:""}); }
  });
  cells.forEach(c => {
    if(c.getAttribute("edge") !== "1") return;
    const f = byId[c.getAttribute("source")], t = byId[c.getAttribute("target")];
    if(f && t && f !== t) edges.push({from:f, to:t, label:stripTags(c.getAttribute("value"))});
  });
  if(!nodes.length) return {error:"이름이 있는 도형을 찾지 못했습니다."};
  return {nodes, edges};
}

/* 가져온 노드만 배치한다 — 기존 노드 위치는 절대 건드리지 않는다 */
function freeOrigin(tab){
  const others = tab.nodes.filter(n => !n._aiPreview);
  if(!others.length) return {x:2000, y:2000};
  let maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  others.forEach(n => {
    const sz = sizeOf(n.id);
    maxX = Math.max(maxX, n.x + sz.w);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y + sz.h);
  });
  return {x: Math.min(3600, maxX + 420), y: (minY + maxY) / 2};
}
/* 부모 관계가 있으면 방사형 층으로, 없으면 격자로 */
function layoutImported(newNodes, newEdges, origin){
  const ids = new Set(newNodes.map(n => n.id));
  const kids = {}, hasParent = {};
  newEdges.filter(e => e.isParent && ids.has(e.from) && ids.has(e.to)).forEach(e => {
    (kids[e.from] || (kids[e.from] = [])).push(e.to);
    hasParent[e.to] = 1;
  });
  const roots = newNodes.filter(n => !hasParent[n.id]).map(n => n.id);
  if(!roots.length || !Object.keys(kids).length){
    const per = Math.max(1, Math.ceil(Math.sqrt(newNodes.length)));
    newNodes.forEach((n, i) => {
      n.x = Math.round(origin.x + (i % per) * 250);
      n.y = Math.round(origin.y + Math.floor(i / per) * 130 - (Math.ceil(newNodes.length / per) - 1) * 65);
    });
    return;
  }
  const tier = {}, order = [];
  const q = roots.map(id => [id, 0]);
  const seen = new Set(roots);
  while(q.length){
    const [id, d] = q.shift();
    tier[id] = d; order.push(id);
    (kids[id] || []).forEach(c => { if(!seen.has(c)){ seen.add(c); q.push([c, d + 1]); } });
  }
  newNodes.forEach(n => { if(tier[n.id] == null){ tier[n.id] = 0; order.push(n.id); } });
  const byTier = {};
  order.forEach(id => { (byTier[tier[id]] || (byTier[tier[id]] = [])).push(id); });
  const pos = {};
  Object.keys(byTier).forEach(d => {
    const arr = byTier[d], n = arr.length;
    arr.forEach((id, i) => {
      pos[id] = {x: origin.x + (+d) * 300, y: origin.y + (i - (n - 1) / 2) * 150};
    });
  });
  newNodes.forEach(n => {
    const p = pos[n.id] || origin;
    n.x = Math.round(Math.min(3800, Math.max(120, p.x)));
    n.y = Math.round(Math.min(3800, Math.max(120, p.y)));
  });
}

          `drawio(.drawio/.xml)는 도형과 연결선을 그대로 읽고 타입만 AI가 정합니다.</div>` +

      : "";
  };
  ta.addEventListener("input", () => { fileName = ""; setInfo(); });
  const readFile = file => {

    const fr = new FileReader();
    fr.onload = () => { ta.value = String(fr.result || ""); fileName = file.name; setInfo(); };

  ["dragover","dragenter"].forEach(ev => ov.addEventListener(ev, e => { e.preventDefault(); ov.classList.add("imp-drop"); }));
  ["dragleave","drop"].forEach(ev => ov.addEventListener(ev, e => { e.preventDefault(); ov.classList.remove("imp-drop"); }));
  ov.addEventListener("drop", e => { readFile(e.dataTransfer?.files?.[0]); });

async function runImport(raw, fileName){
  const tab = curTab(); if(!tab) return;
  const looksDrawio = /<mxCell|<mxGraphModel|<mxfile|<diagram/i.test(raw) || /\.(drawio|xml)$/i.test(fileName || "");
  genOverlayEl.hidden = false;
  try{
    let pre = null;
    if(looksDrawio){
      pre = await parseDrawio(raw);
      if(pre.error){ toast(pre.error, true); return; }
    }
    const types = typeList(tab).map(t => t.label).join(", ");
    const sys = "너는 창작 세계관 마인드맵에 넣을 노드를 뽑아내는 도구다. 한국어로 답하고, 다른 설명 없이 JSON 하나만 출력한다.\n" +
      "출력 형식: {\"types\":[{\"label\":\"새 타입 이름\"}],\"nodes\":[{\"type\":\"타입 이름\",\"name\":\"노드 이름\",\"desc\":\"1~3문장 설명\"}],\"edges\":[{\"from\":\"노드 이름\",\"to\":\"노드 이름\",\"label\":\"관계\",\"isParent\":true}]}\n" +
      "규칙: nodes 의 type 은 되도록 기존 타입 이름을 쓴다. 꼭 필요할 때만 types 에 새 타입을 제안한다.\n" +
      "edges 의 from/to 는 반드시 nodes 에 있는 이름과 정확히 같아야 한다. 계층(상위→하위) 관계면 isParent 를 true 로 한다.\n" +
      "노드 이름은 짧은 고유명사로, 설명은 문서 내용에 근거해 쓴다. 지어내지 않는다.";
    const body = raw.slice(0, IMPORT_MAX_CHARS);
    const user = pre
      ? `기존 타입: ${types}\n\n아래는 다이어그램에서 추출한 도형과 연결선이다. 이름과 연결 관계는 이미 확정이니 바꾸지 말고, 각 노드의 type 과 desc 만 채워라. edges 는 그대로 두되 isParent 만 판단하라.\n\n` +
          `도형: ${pre.nodes.map(n => n.name).join(", ")}\n` +
          `연결선:\n${pre.edges.map(e => `- ${e.from} → ${e.to}${e.label ? " (" + e.label + ")" : ""}`).join("\n") || "(없음)"}`
      : `기존 타입: ${types}\n\n아래 문서에서 세계관 요소를 뽑아 노드와 관계로 만들어라.\n\n"""\n${body}\n"""`;
    const txt = await callClaude(sys, [{role:"user", content:user}], 4096);
    const data = parseAIJson(txt);
    if(!data || !Array.isArray(data.nodes) || !data.nodes.length){
      toast("가져올 노드를 찾지 못했습니다", true); return;
    }
    applyImportResult(tab, data, pre);
  }catch(err){
    console.error("노드 가져오기 실패", err);
    toast(String(err && err.message || err), true);
  }finally{
    genOverlayEl.hidden = true;
  }
}

function applyImportResult(tab, data, pre){
  /* 1) 새 타입 — 이름이 겹치지 않는 것만 맨 아래에 붙인다 */
  const list = typeList(tab).map(t => ({...t}));
  let addedTypes = 0;
  (Array.isArray(data.types) ? data.types : []).forEach(t => {
    const label = String(t && t.label || "").trim().slice(0, 20);
    if(!label || list.some(x => x.label === label)) return;
    list.push({key:newTypeKey(), label}); addedTypes++;
  });
  if(addedTypes) tab.nodeTypes = list;

  /* 2) 노드 — 이름 중복은 건너뛴다 */
  const existing = new Set(tab.nodes.map(n => (n.name || "").trim()));
  const byName = {}, made = [];
  data.nodes.forEach(nd => {
    const name = String(nd && nd.name || "").trim().slice(0, 60);
    if(!name || existing.has(name) || byName[name]) return;
    const nn = {id:gid(), type:typeKeyOr(tab, String(nd.type || "").trim()),
                name, desc:String(nd.desc || "").slice(0, 2000), x:2000, y:2000, _exp:false};
    byName[name] = nn.id; made.push(nn); tab.nodes.push(nn);
  });
  if(!made.length){ toast("추가할 새 노드가 없습니다 (이미 있는 이름뿐)", true); return; }

  /* 3) 관계 — drawio 는 추출 결과를, 문서는 AI 결과를 쓴다 */
  const src = pre ? pre.edges.map(e => ({...e, isParent:true})) : (Array.isArray(data.edges) ? data.edges : []);
  const aiParent = {};
  if(pre && Array.isArray(data.edges)) data.edges.forEach(e => { aiParent[`${e.from}\u0000${e.to}`] = !!e.isParent; });
  const newEdges = [];
  src.forEach(e => {
    const f = byName[String(e.from || "").trim()], t = byName[String(e.to || "").trim()];
    if(!f || !t || f === t) return;
    const key = `${e.from}\u0000${e.to}`;
    const ne = {id:gid(), from:f, to:t, label:String(e.label || "").slice(0, 20),
                desc:"", isParent: pre ? (aiParent[key] ?? true) : !!e.isParent};
    tab.edges.push(ne); newEdges.push(ne);
  });

  /* 4) 새 노드만 배치 — 기존 노드 좌표는 손대지 않는다 */
  layoutImported(made, newEdges, freeOrigin(tab));
  sel = {nodeIds:made.map(n => n.id), edgeId:null};
  commit(); renderAll(); zoomFit();
  toast(`노드 ${made.length}개 · 관계 ${newEdges.length}개를 추가했습니다` +
        (addedTypes ? ` (새 타입 ${addedTypes}개)` : "") + " — Ctrl+Z 로 되돌릴 수 있습니다");
}

/* ==================================================================
 * §5-4 노드 자동 정렬 — 부모-자식 관계만 사용하는 방사형 트리
 * ================================================================== */
function computeRadialLayout(tab){
  const ids = tab.nodes.filter(n => !n._aiPreview).map(n => n.id);
  const idset = new Set(ids);
  const CX = 2000, CY = 2000, R0 = 360, DR = 300;

  /* 부모-자식 지도 (from=부모 → to=자식) */
  const childMap = {}, hasParent = {};
  tab.edges.filter(e => !e._aiPreview && e.isParent &&
                        idset.has(e.from) && idset.has(e.to) && e.from !== e.to)
    .forEach(e => {
      (childMap[e.from] || (childMap[e.from] = [])).push(e.to);
      hasParent[e.to] = 1;
    });

  const inTree = new Set();
  Object.keys(childMap).forEach(p => { inTree.add(p); childMap[p].forEach(c => inTree.add(c)); });

  const roots = ids.filter(id => inTree.has(id) && !hasParent[id]);
  const isolated = ids.filter(id => !inTree.has(id));
  const multi = roots.length > 1;
  const ringFor = depth => multi ? (R0*0.55 + depth*DR)
                                 : (depth === 0 ? 0 : R0 + (depth-1)*DR);

  /* 리프 수 기반 가중치 — 자식이 많은 가지에 더 넓은 각도 */
  const leaf = {}, seenW = new Set();
  function weigh(id){
    if(seenW.has(id)) return 0;
    seenW.add(id);
    const ch = childMap[id] || [];
    if(!ch.length){ leaf[id] = 1; return 1; }
    let s = 0; ch.forEach(c => s += weigh(c));
    leaf[id] = Math.max(1, s);
    return leaf[id];
  }
  roots.forEach(weigh);

  const pos = {}, placed = new Set();
  let maxDepth = 0;
  function place(id, a0, a1, depth){
    if(placed.has(id)) return;
    placed.add(id);
    maxDepth = Math.max(maxDepth, depth);
    const mid = (a0 + a1) / 2, r = ringFor(depth);
    pos[id] = {x: CX + r*Math.cos(mid), y: CY + r*Math.sin(mid)};
    const ch = (childMap[id] || []).filter(c => !placed.has(c));
    if(!ch.length) return;
    const tot = ch.reduce((s,c) => s + (leaf[c] || 1), 0) || 1;
    let a = a0;
    ch.forEach(c => {
      const span = (a1 - a0) * ((leaf[c] || 1) / tot);
      place(c, a, a + span, depth + 1);
      a += span;
    });
  }
  if(roots.length){
    const W = roots.reduce((s,r) => s + (leaf[r] || 1), 0) || 1;
    let a = -Math.PI / 2;
    roots.forEach(r => {                 /* 트리가 여러 개면 원을 트리별로 분할 */
      const span = 2*Math.PI * ((leaf[r] || 1) / W);
      place(r, a, a + span, 0);
      a += span;
    });
  }
  /* 사이클 등으로 미배치된 트리 노드는 고립 취급 */
  ids.forEach(id => { if(!placed.has(id)) isolated.push(id); });

  /* 고립 노드: 최외곽 링에 균등 배치 */
  const uniqIso = [...new Set(isolated)].filter(id => !pos[id]);
  if(uniqIso.length){
    const rr = roots.length ? ringFor(maxDepth) + DR : R0;
    const step = 2*Math.PI / uniqIso.length;
    uniqIso.forEach((id, i) => {
      const a = -Math.PI/2 + step*(i + 0.5);
      pos[id] = {x: CX + rr*Math.cos(a), y: CY + rr*Math.sin(a)};
    });
  }

  /* 겹침 제거 — Force Repulsion, 최소 간격 220px */
  const arr = ids.map(id => ({id, x:(pos[id]||{x:CX}).x, y:(pos[id]||{y:CY}).y}));
  const MIN = 220;
  for(let it = 0; it < 90; it++){
    let movedAny = false;
    for(let i = 0; i < arr.length; i++){
      for(let j = i+1; j < arr.length; j++){
        const a = arr[i], b = arr[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        if(d < 0.5){ dx = Math.random()-0.5; dy = Math.random()-0.5; d = Math.hypot(dx,dy); }
        if(d < MIN){
          const push = (MIN - d) / 2 / d;
          a.x -= dx*push; a.y -= dy*push;
          b.x += dx*push; b.y += dy*push;
          movedAny = true;
        }
      }
    }
    if(!movedAny) break;
  }
  arr.forEach(p => {
    p.x = Math.min(3850, Math.max(150, p.x));
    p.y = Math.min(3850, Math.max(150, p.y));
  });

  /* 중심 좌표 → 카드 좌상단 좌표 */
  const out = {};
  arr.forEach(p => {
    const s = nodeSizes[p.id] || {w:200, h:70};
    out[p.id] = {x: Math.round(p.x - s.w/2), y: Math.round(p.y - s.h/2)};
  });
  return out;
}

/* 정렬 적용 — 최종 좌표를 즉시 확정·커밋하고, 0.5초 트랜지션은 순수 시각 효과로만 돌린다.
   ⚠ 애니메이션 중간 프레임을 tab.nodes 에 쓰면 그 값이 localStorage·Firebase·되돌리기로 새어나간다. */
function tweenTo(targets){
  const tab = curTab(); if(!tab) return;
  const from = {};
  tab.nodes.forEach(n => { if(targets[n.id]) from[n.id] = {x:n.x, y:n.y}; });

  /* ① 최종 좌표를 먼저 데이터에 확정 — 중단돼도(되돌리기·탭 전환·백그라운드 탭) 결과와 되돌리기 지점이 남는다 */
  cancelTween();
  tab.nodes.forEach(n => {
    const tg = targets[n.id]; if(!tg) return;
    n.x = Math.round(tg.x); n.y = Math.round(tg.y);
  });
  commit();

  /* ② 0.5초 애니메이션은 화면(tweenPos)만 움직인다 */
  const my = tweenSeq, tabId = activeTabId;
  const t0 = performance.now();
  const ease = p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
  function step(now){
    if(my !== tweenSeq) return;                          // 다른 트윈/취소가 인계
    if(activeTabId !== tabId){ cancelTween(); return; }  // 탭이 바뀌면 표시 좌표를 걷어낸다
    const p = Math.min(1, (now - t0)/500);
    const e = ease(p);
    const disp = {};
    tab.nodes.forEach(n => {
      const f = from[n.id]; if(!f) return;
      const x = f.x + (n.x - f.x)*e, y = f.y + (n.y - f.y)*e;
      disp[n.id] = {x, y};
      const el = nodesEl.querySelector(`[data-id="${n.id}"]`);
      if(el){ el.style.left = x + 'px'; el.style.top = y + 'px'; }
    });
    tweenPos = disp;
    updateAllEdgeGeom();
    if(p < 1){ requestAnimationFrame(step); return; }
    tweenPos = null;
    renderEdges();
    zoomFit();
  }
  requestAnimationFrame(step);
}

function askAutoLayout(){
  if(!reqEdit()) return;
  const tab = curTab();
  if(!tab || tab.nodes.length < 2){ toast('정렬할 노드가 부족합니다', true); return; }
  confirmModal({
    title:'노드 자동 정렬', ok:'정렬 실행',
    html:`부모-자식 관계를 기준으로 방사형 트리로 재배치합니다.<br>
          <span style="color:var(--text3)">일반 관계(점선)는 배치에 영향을 주지 않으며, 현재 좌표는 덮어써집니다.<br>
          펼쳐 둔 설명은 모두 접힙니다 — 카드 크기를 접힌 상태로 통일해야 간격이 고르게 잡힙니다.</span>`,
    onOk:() => {
      /* 확인을 누른 시점의 활성 탭을 다시 확인한다. 모달이 떠 있는 동안에도 원격 동기화가 탭을
         바꿀 수 있고, 되돌리기(applyStruct)는 tabs 배열을 새 객체로 갈아끼운다 —
         위에서 캡처한 tab 은 이미 버려진 사본일 수 있다. 안내한 그 탭이 아니면 아무것도 하지 않는다. */
      const t = curTab();
      if(!t || t.id !== tab.id || t.nodes.length < 2){ toast('탭이 바뀌어 정렬을 취소했습니다', true); return; }
      cancelTween();        // 앞선 정렬 애니메이션이 남아 있으면 표시 좌표를 걷어낸다
      /* 정렬 기준 크기를 '접힌 카드'로 통일한다.
         _exp 는 .nd 를 display:block 으로 바꿔 카드를 최대 240x(본문 200px) 까지 키우고,
         그 실측값(nodeSizes)이 computeRadialLayout 의 중심→좌상단 환산과 zoomFit 을 흔든다.
         반발 루프는 MIN=220 상수만 쓰므로 펼친 카드는 서로 겹친 채 배치된다.
         (.node.sel 은 border-color/box-shadow 뿐이라 크기에 영향이 없다 → 선택은 건드리지 않는다.)
         _aiPreview 는 배치 대상에서 제외되므로 검토용 펼침을 그대로 둔다.
         _exp 는 런타임 전용이라 cleanTab·normFB 어디에도 안 잡힌다 → 되돌리기·Firebase 쓰기를 만들지 않는다. */
      t.nodes.forEach(n => { if(!n._aiPreview) n._exp = false; });
      renderAll();          // renderNodes 의 offsetWidth 읽기가 동기 리플로를 강제 → nodeSizes 즉시 재실측
      tweenTo(computeRadialLayout(t));
    }
  });
}
/* ==================================================================
 * §6 AI 호출 헬퍼
 * ================================================================== */
async function callClaude(system, messages, maxTokens = 2000){
  const d = await apiPost('/api/claude', {model:AI_MODEL, max_tokens:maxTokens, system, messages});
  return (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
}

async function callGemini(prompt, refImgs){
  const parts = [];
  (refImgs || []).slice(0,3).forEach(dataUrl => {
    const m = /^data:(image\/[\w.+-]+);base64,(.+)$/s.exec(dataUrl || '');
    if(m) parts.push({inlineData:{mimeType:m[1], data:m[2]}});
  });
  parts.push({text: prompt});
  const d = await apiPost('/api/gemini', {
    model: IMG_MODEL,
    contents:[{parts}],
    generationConfig:{responseModalities:['IMAGE','TEXT']}
  });
  const outParts = d?.candidates?.[0]?.content?.parts || [];
  const img = outParts.find(p => p.inlineData);
  if(!img) throw new Error('이미지가 반환되지 않았습니다');
  return 'data:' + (img.inlineData.mimeType || 'image/png') + ';base64,' + img.inlineData.data;
}

/* ==================================================================
 * §6-4 컨텍스트 빌더 — 노드/관계/사건 목록 문자열 (모든 AI 기능이 재사용)
 * ================================================================== */
function buildCtx(tab){
  const nameOf = id => nodeById(tab, id)?.name ?? '?';
  const nodesStr = tab.nodes.filter(n => !n._aiPreview)
    /* 복수 타입과 구조화 속성까지 넘겨 AI 가 정확히 읽게 한다 */
    .map(n => {
      const ts = nodeTypeLabels(tab, n).join('·');
      const ps = (n.props || []).filter(p => p.v).map(p => `${p.k}: ${p.v}`).join(', ');
      return `- ${n.name} (${ts})${ps ? ' {' + ps + '}' : ''}${n.desc ? ': ' + n.desc : ''}`;
    })
    .join('\n') || '(없음)';
  const edgesStr = tab.edges.filter(e => !e._aiPreview)
    .map(e => `- ${nameOf(e.from)} ${e.isParent ? '⊃(부모→자식)' : '↔'} ${nameOf(e.to)} [${e.label || '관계'}]${e.desc ? ': ' + e.desc : ''}`)
    .join('\n') || '(없음)';
  const eventsStr = [...tab.events]
    .sort((a,b) => (a.order ?? 0) - (b.order ?? 0))
    .map(ev => `- (order ${ev.order ?? 0}) ${ev.time || '시점 미상'}: ${ev.body}`)
    .join('\n') || '(없음)';
  const names = tab.nodes.filter(n => !n._aiPreview).map(n => n.name).filter(Boolean);
  return {nodesStr, edgesStr, eventsStr, names};
}
function worldSystem(tab){
  const c = buildCtx(tab);
  return `너는 창작 세계관 구축을 돕는 어시스턴트다. 아래는 사용자가 만들고 있는 세계관의 현재 정보다. 한국어로 답한다.

[세계관 설정]
${tab.worldPrompt || '(아직 작성되지 않음)'}

[노드 목록]
${c.nodesStr}

[관계 목록]
${c.edgesStr}

[사건 연표]
${c.eventsStr}`;
}

const RP_TITLES = {world:'🌐 세계관 설정', chat:'💬 세계관 대화', events:'📜 사건 연표'};

function openPanel(name){

function closePanel(){

  rpEl.hidden = true;

function refreshOpenPanels(){

/* ---------------- §5-5 세계관 패널 ---------------- */
function renderWorldPanel(){
  const tab = curTab(); if(!tab) return;
  const ta = $('#wpText');
  if(document.activeElement !== ta) ta.value = tab.worldPrompt || '';
  ta.readOnly = !editMode;
  const grid = $('#refImgs');
  grid.innerHTML = '';
  (tab.refImages || []).slice(0,3).forEach((src, i) => {
    const slot = document.createElement('div');
    slot.className = 'ref-slot';
    slot.innerHTML = `<img src="${src}" alt="참고 이미지 ${i+1}">` +
                     (editMode ? `<button class="rx" title="삭제">✕</button>` : '');
    const rx = slot.querySelector('.rx');
    if(rx) rx.onclick = () => {
      tab.refImages.splice(i,1);
      markDirty();                       // refImages는 로컬 전용 (§1-2)
      renderWorldPanel();
    };
    grid.appendChild(slot);
  });
  if(editMode && (tab.refImages || []).length < 3){
    const add = document.createElement('div');
    add.className = 'ref-slot ref-add';
    add.textContent = '＋';
    add.title = '참고 이미지 추가';
    add.onclick = () => $('#refFile').click();
    grid.appendChild(add);
  }
  if(!editMode && !(tab.refImages || []).length){
    grid.innerHTML = '<div class="empty" style="padding:8px 0">등록된 이미지가 없습니다</div>';
  }
}

function handleRefFile(file){
  if(!file || !editMode) return;
  const tab = curTab();
  if((tab.refImages || []).length >= 3){ toast('이미지는 최대 3장입니다', true); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX = 640;
      const k = Math.min(1, MAX / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k);
      cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      tab.refImages.push(cv.toDataURL('image/jpeg', 0.85));
      markDirty();
      renderWorldPanel();
      toast('참고 이미지를 추가했습니다');
    };
    img.onerror = () => toast('이미지를 읽지 못했습니다', true);
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- §5-6 대화 패널 ---------------- */
function renderChat(){
  const tab = curTab(); if(!tab) return;
  if(!tab._chat) tab._chat = [];
  chatLogEl.innerHTML = '';
  if(!tab._chat.length){
    chatLogEl.innerHTML = '<div class="empty">세계관에 대해 무엇이든 물어보세요.<br>설정·노드·관계·사건을 모두 알고 답합니다.</div>';
  }
  tab._chat.forEach(m => {
    const el = document.createElement('div');
    el.className = 'msg ' + (m.role === 'user' ? 'u' : 'a');
    el.textContent = m.content;
    chatLogEl.appendChild(el);
  });
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

async function sendChat(){
  const tab = curTab(); if(!tab) return;
  const ta = $('#chatText');
  const text = ta.value.trim();
  if(!text) return;
  if(!tab._chat) tab._chat = [];
  ta.value = '';
  tab._chat.push({role:'user', content:text});
  renderChat();
  const loadEl = document.createElement('div');
  loadEl.className = 'msg a load';
  loadEl.textContent = '생각하는 중…';
  chatLogEl.appendChild(loadEl);
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
  const btn = $('#chatSend');
  btn.disabled = true;
  try{
    const reply = await callClaude(
      worldSystem(tab),
      tab._chat.map(m => ({role:m.role, content:m.content})),
      1500
    );
    tab._chat.push({role:'assistant', content:reply.trim()});
  }catch(err){
    tab._chat.pop();                      // 실패한 질문 롤백
    ta.value = text;
    toast(err.message, true);
  }finally{
    btn.disabled = false;
    renderChat();
  }
}

  if(!list.length){

      `<span class="ev-acts"><button data-a="e" title="편집">✏️</button><button data-a="d" title="삭제">🗑</button></span></div>` +
      `<div class="ev-b">${escHtml(ev.body || '')}</div>`;

}

      `[선택된 노드]\n` +
      picked.map(p => `- ${p.name} (${typeLabel(tab, p.type)})${p.desc ? ': ' + p.desc : ''}`).join('\n') + `\n` +
      `- 선택된 노드 전부가 자연스럽게 얽히도록 하라.\n` +
      `- 그 외 등장 대상도 사용 가능한 이름 목록(${c.names.join(', ') || '없음'}) 안에서만 고른다.\n` +
      `- 기존 사건들과 시간 흐름이 자연스럽게 이어지도록 order 정수를 정하라. 기존 사건 사이에 끼워 넣어도 된다.\n` +
      `- 다른 설명 없이 아래 JSON 형식만 출력하라:\n` +
      `{"time":"자유 형식 시간 표현","body":"사건 내용 2~4문장","order":정수}`;
    const raw = await callClaude(sys, [{role:'user', content:user}], 1400);
    const parsed = parseAIJson(raw, 'object');
    if(!parsed || !parsed.body) throw new Error('AI 응답을 해석하지 못했습니다. 다시 시도해주세요.');
    tab.events.push({
      id: gid(),
      time: String(parsed.time || ''),
      body: String(parsed.body),
      order: Number.isFinite(+parsed.order) ? Math.round(+parsed.order) : maxOrder(tab) + 10
    });
    commit();
    exitEventPick();
    clearSel(); renderAll();
    if(rpCur !== 'events') openPanel('events'); else renderEvents();
    toast(`선택한 노드 ${picked.length}개를 바탕으로 사건을 추가했습니다`);
  }catch(err){
    toast(err.message, true);
    evPick.busy = false;
    updatePickBanner();
    btn.textContent = '✨ 생성';
  }
}
/* ==================================================================
 * §5-9 AI 노드 생성 — 프롬프트 → 미리보기 배치 → 추가/재생성/닫기
 * ================================================================== */
function clearPreview(){
  const tab = curTab(); if(!tab) return;
  tab.nodes = tab.nodes.filter(n => !n._aiPreview);
  tab.edges = tab.edges.filter(e => !e._aiPreview);
  aiPanelEl.hidden = true;
}
function hasPreview(){
  const tab = curTab();
  return !!tab && tab.nodes.some(n => n._aiPreview);
}

function openAiGenModal(){
  if(!reqEdit()) return;
  if(hasPreview()){ toast('먼저 현재 미리보기를 확정하거나 닫아주세요', true); return; }
  const ov = openModal({
    title:'✨ AI 노드 생성',
    body:`
      <div><label>만들고 싶은 설정을 한 줄로 적어주세요</label>
      <textarea id="agPrompt" rows="4" placeholder="예: 몰락한 해상 왕국의 마지막 공주와 그녀를 쫓는 해적단, 저주받은 나침반">${escHtml(lastGenPrompt)}</textarea></div>
      <div class="infobox">프롬프트에 등장하는 주요 인물·장소·사물·집단이 모두 노드로 만들어지고, 기존 노드와도 이름이 맞으면 자동으로 연결됩니다. 생성 결과는 미리보기로 먼저 표시됩니다.</div>`,

  });

    closeModal(ov);
    runAiGen(p);
  };

async function runAiGen(prompt){
  lastGenPrompt = prompt;
  genOverlayEl.hidden = false;
  try{
    const tab = curTab();
    const c = buildCtx(tab);
    const sys = worldSystem(tab) + `

너의 임무: 사용자의 프롬프트를 읽고 세계관 마인드맵에 추가할 노드와 관계를 JSON으로 설계한다.
규칙:
- 프롬프트에 등장하는 모든 주요 명사(인물·장소·사물·집단·개념)를 각각 노드로 만든다.
- type은 반드시 다음 중 하나: world, group, space, char, item, trait, custom
- 이미 존재하는 노드(${c.names.join(', ') || '없음'})와 관련이 있으면, 그 "정확한 이름"을 from/to에 써서 관계로 연결한다. 기존 노드를 새로 만들지 않는다.
- 관계 label은 4자 이내의 짧은 한국어. 계층(소속/포함) 관계면 isParent를 true로.
- 다른 텍스트 없이 JSON 하나만 출력한다.`;
    const user =
      `프롬프트: ${prompt}\n\n아래 형식의 JSON만 출력:\n` +
      `{"nodes":[{"type":"char","name":"이름","desc":"설정 설명 1~2문장"}],` +
      `"edges":[{"from":"이름","to":"이름","label":"관계","desc":"관계 설명","isParent":false}]}`;
    const raw = await callClaude(sys, [{role:'user', content:user}], 3800);
    let parsed = parseAIJson(raw, 'object');
    if(Array.isArray(parsed)) parsed = {nodes:parsed, edges:[]};
    const newNodes = Array.isArray(parsed?.nodes) ? parsed.nodes : [];
    const newEdges = Array.isArray(parsed?.edges) ? parsed.edges : [];
    if(!newNodes.length && !newEdges.length)
      throw new Error('AI 응답을 해석하지 못했습니다. 프롬프트를 조금 바꿔 다시 시도해주세요.');

    /* 이름 → id 매핑 (기존 노드 우선) */
    const nameToId = {};
    tab.nodes.filter(n => !n._aiPreview).forEach(n => { nameToId[n.name] = n.id; });

    const center = viewCenterWorld();
    const fresh = newNodes.filter(nd => nd && nd.name && !nameToId[nd.name]);
    const cols = Math.max(1, Math.ceil(Math.sqrt(fresh.length)));
    let addedNodes = 0;
    fresh.forEach((nd, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const nn = {
        id: gid(),
        type: typeKeyOr(tab, nd.type),
        name: String(nd.name).slice(0,60),
        desc: String(nd.desc || ''),
        x: Math.round(center.x - (cols-1)*135 + col*270 + (Math.random()*56-28)),
        y: Math.round(center.y - 120 + row*180 + (Math.random()*44-22)),
        _exp: true,           /* 설명 펼친 상태로 배치 (§5-9) */
        _aiPreview: true
      };
      tab.nodes.push(nn);
      nameToId[nn.name] = nn.id;
      addedNodes++;
    });

    let addedEdges = 0;
    newEdges.forEach(ed => {
      const from = nameToId[ed?.from], to = nameToId[ed?.to];
      if(!from || !to || from === to) return;
      if(tab.edges.some(e => (e.from===from && e.to===to) || (e.from===to && e.to===from))) return;
      tab.edges.push({
        id: gid(), from, to,
        label: String(ed.label || '').slice(0,20),
        desc: String(ed.desc || ''),
        isParent: !!ed.isParent,
        _aiPreview: true
      });
      addedEdges++;
    });

    if(!addedNodes && !addedEdges)
      throw new Error('추가할 새 노드가 없습니다. 프롬프트를 더 구체적으로 적어주세요.');

    renderAll();
    aiPanelInfoEl.innerHTML = `새 노드 <b>${addedNodes}개</b> · 새 관계 <b>${addedEdges}개</b><br>캔버스에서 미리보기를 확인해주세요.`;
    aiPanelEl.hidden = false;
  }catch(err){
    toast(err.message, true);
    clearPreview();
    renderAll();
  }finally{
    genOverlayEl.hidden = true;
  }
}

function acceptPreview(){
  const tab = curTab(); if(!tab) return;
  let n = 0, e = 0;
  tab.nodes.forEach(x => { if(x._aiPreview){ delete x._aiPreview; n++; } });
  tab.edges.forEach(x => { if(x._aiPreview){ delete x._aiPreview; e++; } });
  aiPanelEl.hidden = true;
  commit(); renderAll();
  toast(`노드 ${n}개 · 관계 ${e}개를 추가했습니다`);
}

function openRecModal(title, fetcher, applyFn){
  const ov = openModal({
    title, wide:true,

    footer:`<button class="btn" data-a="r">↻ 다시 추천</button><button class="btn" data-a="c">닫기</button>`
  });
  const bodyEl = ov.querySelector('#recBody');
  ov.querySelector('[data-a=c]').onclick = () => closeModal(ov);
  ov.querySelector('[data-a=r]').onclick = () => load();
  async function load(){
    bodyEl.innerHTML = `<div class="center"><div class="spin"></div>AI가 추천을 만드는 중…</div>`;
    try{
      const items = await fetcher();
      if(!items.length) throw new Error('추천 결과를 해석하지 못했습니다. 다시 시도해주세요.');
      bodyEl.innerHTML = '';
      items.slice(0,3).forEach(item => {

        card.innerHTML = `<div class="c-t">${escHtml(item._t)}</div><div class="c-d">${escHtml(item._d)}</div>`;
        card.onclick = () => {

      });
      const hint = document.createElement('div');

    }
  }
  load();
}

const parse3 = raw => {
  const v = parseAIJson(raw, 'array');
  if(Array.isArray(v)) return v.filter(x => x && typeof x === 'object');
  if(v && typeof v === 'object'){
    const arr = Object.values(v).find(Array.isArray);
    if(arr) return arr.filter(x => x && typeof x === 'object');
  }
  return [];
};

/* ==================================================================

 * ================================================================== */
function visitVerb(type){
  if(type === 'space' || type === 'world') return '그 장소를 직접 방문해 둘러보는';
  if(type === 'char' || type === 'group') return '그 대상과 만나 대화를 나누는';
  if(type === 'item') return '그 사물을 획득하거나 가까이에서 관찰하는';
  return '그 요소를 직접 체험하는';
}

function openVisitModal(node){
  const tab = curTab();
  const ov = openModal({
    title:`🧭 주인공 방문 — ${escHtml(node.name)}`, wide:true,
    body:`<div id="vImgWrap" hidden></div><div id="vScene"><div class="center"><div class="spin"></div>장면을 쓰는 중…</div></div>`,
    footer:`<button class="btn" data-a="r">↻ 다시 추천</button>
            <button class="btn" data-a="i">🖼 이미지 생성</button>
            ${editMode ? '<button class="btn gold" data-a="s">📜 사건으로 저장</button>' : ''}
            <button class="btn" data-a="c">닫기</button>`
  });
  const sceneEl = ov.querySelector('#vScene');
  const imgWrap = ov.querySelector('#vImgWrap');
  ov.querySelector('[data-a=c]').onclick = () => closeModal(ov);
  ov.querySelector('[data-a=r]').onclick = () => gen();
  ov.querySelector('[data-a=i]').onclick = () => genImage();
  const saveBtn = ov.querySelector('[data-a=s]');
  if(saveBtn) saveBtn.onclick = () => saveAsEvent();

  async function gen(){
    sceneEl.innerHTML = `<div class="center"><div class="spin"></div>장면을 쓰는 중…</div>`;
    imgWrap.hidden = true; imgWrap.innerHTML = '';
    try{
      const c = buildCtx(tab);
      const linked = tab.edges.filter(e => !e._aiPreview && (e.from===node.id || e.to===node.id))
        .map(e => {
          const other = nodeById(tab, e.from===node.id ? e.to : e.from);
          return other ? `${other.name}(${e.label || '관계'})` : null;
        }).filter(Boolean);
      const sys = worldSystem(tab) +
        `\n\n[중요 제약] 장면에는 반드시 아래 "사용 가능한 이름" 목록에 있는 대상만 등장시켜야 한다. 목록에 없는 새 인물·장소·사물·집단·고유명사를 만들어내면 안 된다. 이름 없는 '주인공'만 예외다.\n사용 가능한 이름: ${c.names.join(', ') || '(없음)'}`;
      const user =
        `주인공이 "${node.name}" (${typeLabel(tab, node.type)}${node.desc ? ': ' + node.desc : ''})에 대해 ${visitVerb(node.type)} 장면을 한국어 2~3문단으로 서술하라.\n` +
        (linked.length ? `연결된 요소를 자연스럽게 함께 등장시켜라: ${linked.join(', ')}\n` : '') +
        `제약: 사용 가능한 이름 목록(${c.names.join(', ') || '없음'}) 외의 고유명사 금지. 문단은 빈 줄로 구분. 제목이나 부가 설명 없이 본문만.`;
      const text = (await callClaude(sys, [{role:'user', content:user}], 1800)).trim();
      lastVisit = {node, text};
      sceneEl.innerHTML = text.split(/\n{2,}/).map(p => `<p>${escHtml(p.trim()).replace(/\n/g,'<br>')}</p>`).join('');
    }catch(err){
      sceneEl.innerHTML = `<div class="empty">${escHtml(err.message)}</div>`;
    }
  }

  async function genImage(){
    if(!lastVisit || lastVisit.node !== node){ toast('먼저 장면 생성을 기다려주세요', true); return; }
    imgWrap.hidden = false;
    imgWrap.innerHTML = `<div class="center"><div class="spin"></div>일러스트를 그리는 중…</div>`;
    try{
      const style = (tab.refImages || []).length
        ? '첨부한 참고 이미지의 그림체와 색감을 따른다.'
        : '다크 판타지 일러스트, 절제된 조명과 깊은 색감.';
      const prompt = `${style}\n세계관 분위기: ${(tab.worldPrompt || '').slice(0,300) || '다크 판타지'}\n` +
        `다음 장면을 한 장의 일러스트로: ${lastVisit.text.slice(0,600)}`;
      const url = await callGemini(prompt, tab.refImages);
      imgWrap.innerHTML = `<img src="${url}" alt="장면 일러스트">`;
    }catch(err){
      imgWrap.innerHTML = `<div class="empty">${escHtml(err.message)}</div>`;
    }
  }

  function saveAsEvent(){
    if(!reqEdit()) return;
    if(!lastVisit || lastVisit.node !== node){ toast('먼저 장면 생성을 기다려주세요', true); return; }
    tab.events.push({
      id: gid(),
      time: '기록되지 않은 시점',
      body: `[${node.name} 방문] ` + lastVisit.text,
      order: maxOrder(tab) + 10
    });
    commit();
    if(rpCur === 'events') renderEvents();
    toast('사건 연표에 저장했습니다');
  }

  gen();
}

function renderTabs(){
  tabsEl.innerHTML = '';
  tabs.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === activeTabId ? ' act' : '');
    el.innerHTML =
      `<span class="tt" title="${escHtml(t.title)}">${escHtml(t.title || '무제')}</span>` +
      `<span class="tacts"><button class="ta" data-a="d" title="복제">⧉</button>` +
      `<button class="ta td" data-a="x" title="삭제">✕</button></span>`;
    const tt = el.querySelector('.tt');
    tt.onclick = () => switchTab(t.id);
    tt.ondblclick = () => { if(editMode) openRenameTab(t); };
    el.querySelector('[data-a=d]').onclick = e => { e.stopPropagation(); duplicateTab(t); };
    el.querySelector('[data-a=x]').onclick = e => { e.stopPropagation(); askDeleteTab(t); };
    tabsEl.appendChild(el);
  });
}

function switchTab(id){
  if(id === activeTabId) return;
  cancelTween();           // 떠나는 탭의 정렬 애니메이션 프레임이 새 탭 DOM 을 덮어쓰지 않게
  clearPreview();          // 떠나는 탭의 AI 미리보기 정리
  exitLink(); closeCtx();
  activeTabId = id;
  clearSel(); exitEventPick();
  renderTabs(); renderAll(); zoomFit(); refreshOpenPanels();
  if(fbReady) attachTab(id);
  if(curTab() && !lastMap[id]) lastMap[id] = snapTab(curTab());   // 한 번도 커밋 안 한 탭의 기준선
  markDirty();
}

function addTab(){
  if(!reqEdit()) return;
  const t = makeDefaultTab();
  tabs.push(t);
  renderTabs();
  switchTab(t.id);         // attachTab → 빈 스냅샷 → 새 탭 전체 push
  lastMap[t.id] = snapTab(t); commit();    // 탭 추가를 구조 스택에 적재 (되돌리기 대상)
  toast('새 세계관을 만들었습니다');
}

/* §5-1 복제 — 전체 딥카피 + ID 재발급 + 엣지 리맵.
 * ⚠ Firebase diff 스냅샷은 attachTab에서 항상 빈 상태로 시작하므로
 *   복제 탭도 "변경 없음"으로 오판되지 않고 전량 기록된다. */
function duplicateTab(src){
  if(!reqEdit()) return;
  const base = cleanTab(src);
  const nt = sanitizeTab({
    id: gid(), title: '복사_' + (src.title || '무제'),
    nodes:[], edges:[], events:[],
    worldPrompt: base.worldPrompt,
    refImages: [...base.refImages]
  });
  const idMap = {};
  base.nodes.forEach(n => {
    const ni = gid(); idMap[n.id] = ni;
    nt.nodes.push({...n, id:ni, _exp:false});
  });
  base.edges.forEach(e => {
    const f = idMap[e.from], to = idMap[e.to];
    if(!f || !to) return;
    nt.edges.push({...e, id:gid(), from:f, to});
  });
  base.events.forEach(ev => nt.events.push({...ev, id:gid()}));
  tabs.push(nt);
  renderTabs();
  switchTab(nt.id);
  lastMap[nt.id] = snapTab(nt); commit();  // 탭 복제를 구조 스택에 적재
  toast('탭을 복제했습니다');
}

function askDeleteTab(t){
  if(!reqEdit()) return;
  if(tabs.length <= 1){ toast('마지막 탭은 삭제할 수 없습니다', true); return; }
  confirmModal({
    title:'세계관 삭제', danger:true, ok:'삭제',
    html:`"<b>${escHtml(t.title)}</b>" 탭을 삭제할까요?<br>` +
         `<span style="color:var(--text3)">노드 ${t.nodes.length} · 관계 ${t.edges.length} · 사건 ${t.events.length}개가 함께 삭제됩니다.</span>`,
    onOk:() => {
      const idx = tabs.findIndex(x => x.id === t.id);
      const prevActive = activeTabId, prevJson = lastTabListJson;
      tabs = tabs.filter(x => x.id !== t.id);
      if(activeTabId === t.id){
        activeTabId = tabs[0].id;
        clearSel();
        if(fbReady) attachTab(activeTabId);
        renderAll(); zoomFit(); refreshOpenPanels();
      }
      renderTabs();
      /* ⚠ tabs/{id} 제거와 tabList 갱신이 갈라지면 다음 로드 때 '내용 없는 빈 탭'으로 되살아난다.
         RTDB 다중 경로 update 는 원자적이므로 한 번의 update 로 묶는다. */
      if(fbReady && fbRoot && editMode){
        const tl = tabs.map(x => ({id:x.id, title:x.title ?? '무제'}));
        lastTabListJson = JSON.stringify(tl);
        fbRoot.update({['tabs/' + t.id]: null, tabList: tl}).then(fbWriteOk, err => {
          lastTabListJson = prevJson;
          tabs.splice(idx < 0 ? tabs.length : idx, 0, t);
          activeTabId = prevActive;
          renderTabs(); renderAll(); refreshOpenPanels();
          if(fbReady) attachTab(activeTabId);
          markDirty();
          fbWriteFail(err);
          toast('탭을 삭제하지 못했습니다 — 되돌렸습니다', true);
        });
      }
      dropTabUndo(t.id);   // 사라진 탭의 편집 히스토리 폐기 (구조 스택이 탭 자체는 복원한다)
      commit();
      toast('삭제했습니다');
    }
  });
}

function openRenameTab(t){
  const ov = openModal({
    title:'세계관 이름 변경',
    body:`<div><label>이름</label><input id="rnName" maxlength="40" value="${escHtml(t.title || '')}"></div>`,

/* ==================================================================
 * ↩ 되돌리기 / 다시 실행 — commit 시점 스냅샷 복원
 * ================================================================== */
function reviveTab(s){
  return sanitizeTab({
    ...s,
    nodes: s.nodes.map(n => ({...n, _exp:false})),
    edges: s.edges.map(e => ({...e})),
    events: s.events.map(v => ({...v})),
    refImages: [...(s.refImages || [])]
  });
}
/* 탭 하나만 그 탭의 이전 상태로 — 활성 탭에만 쓰므로 보고 있던 탭이 바뀌지 않는다 */
function applyTabSnapshot(st){
  cancelTween();                         // 진행 중인 정렬 애니메이션이 DOM 을 덮어쓰지 않게
  const nt = reviveTab(st);
  const i = tabs.findIndex(t => t.id === st.id);
  if(i < 0) tabs.push(nt); else tabs[i] = nt;
  activeTabId = nt.id;
  clearSel(); exitLink(); exitEventPick();
  aiPanelEl.hidden = true;
  ensureIdCounter();
  markDirty();
  lastState = snapState();               // 탭 집합은 그대로 — 구조 기준점만 갱신
  renderTabs(); renderAll(); refreshOpenPanels();
  if(fbReady) fbSyncActive();            // 항상 활성 탭이므로 diff 동기화로 충분
}
/* 탭 집합만 그 시점으로 — 살아남은 탭의 내용은 건드리지 않는다(다른 탭 작업 보존).
   e.full(가져오기 되돌리기)만 내용까지 복원한다. */
function applyStruct(e){
  cancelTween();
  const st = e.st, prefer = activeTabId;
  const byId = Object.create(null); tabs.forEach(t => { byId[t.id] = t; });
  tabs = st.tabs.map(t => (!e.full && byId[t.id]) ? byId[t.id] : reviveTab(t));
  if(!tabs.length) tabs = [makeDefaultTab()];
  const has = id => tabs.some(t => t.id === id);
  activeTabId = has(prefer) ? prefer : (has(st.activeTabId) ? st.activeTabId : tabs[0].id);
  clearSel(); exitLink(); exitEventPick();
  aiPanelEl.hidden = true;
  ensureIdCounter();
  markDirty();
  if(e.full) resetTabUndo(); else reseedTabBase();
  lastState = snapState();
  renderTabs(); renderAll(); refreshOpenPanels();
  /* 탭이 되살아나거나 사라진 복원이다 — 활성 탭 diff 만으로는 tabList 와 tabs/{id} 가 갈라진다 */
  if(fbReady) pushAllToFB().then(() => attachTab(activeTabId, false));
}
function doUndo(){
  if(!reqEdit()) return;
  const id = activeTabId, stk = undoMap[id] || [];
  if(stk.length && topSeq(stk) > topSeq(undoStack)){        // 더 나중 변경부터 — 시간 역순 보장
    (redoMap[id] = redoMap[id] || []).push({seq: topSeq(stk), st: snapTab(curTab())});
    const e = stk.pop();
    lastMap[id] = e.st;
    applyTabSnapshot(e.st);
    toast('되돌렸습니다'); return;
  }
  if(undoStack.length){                                    // 탭 추가·복제·삭제·가져오기
    const e = undoStack.pop();
    redoStack.push({seq: e.seq, st: snapState(), full: e.full});
    applyStruct(e);
    toast('되돌렸습니다'); return;
  }
  toast('되돌릴 작업이 없습니다');
}
function doRedo(){
  if(!reqEdit()) return;
  const id = activeTabId, stk = redoMap[id] || [];
  const rs = stk.length ? topSeq(stk) : Infinity;          // 다시 실행은 시간 정순 — 더 이른 변경부터
  const rg = redoStack.length ? topSeq(redoStack) : Infinity;
  if(stk.length && rs <= rg){
    (undoMap[id] = undoMap[id] || []).push({seq: rs, st: snapTab(curTab())});
    const e = stk.pop();
    lastMap[id] = e.st;
    applyTabSnapshot(e.st);
    toast('다시 실행했습니다'); return;
  }
  if(redoStack.length){
    const e = redoStack.pop();
    undoStack.push({seq: e.seq, st: snapState(), full: e.full});
    applyStruct(e);
    toast('다시 실행했습니다'); return;
  }
  toast('다시 실행할 작업이 없습니다');
}

/* ==================================================================
 * 테마 — 다크(기본) / 라이트(베이지). localStorage wm_theme
 * ================================================================== */
let curTheme = 'dark';
function applyTheme(name, persist = true){
  curTheme = (name === 'light') ? 'light' : 'dark';
  document.body.classList.toggle('light', curTheme === 'light');
  if(persist){ try{ localStorage.setItem('wm_theme', curTheme); }catch(_){} }
  if(nodesEl) renderAll();          // 타입 색이 인라인이라 테마가 바뀌면 다시 칠해야 한다
}

/* §5-14 노드 타입 관리 — 탭별 목록. 순서가 상하위 단계이고 색은 순서를 따른다 */
function openTypeManager(){
  if(!reqEdit()) return;
  const tab = curTab(); if(!tab) return;
  let list = typeList(tab).map(x => ({...x}));
  const ov = openModal({
    title:'🏷 노드 타입', wide:true,
    body:`<div class="hint">맨 위가 최상위 단계이고 아래로 갈수록 하위입니다. 색은 순서를 따라 자동으로 정해집니다.<br>여기서 정한 타입은 <b>이 탭</b>에만 적용되며, 새 탭은 기본 타입으로 시작합니다.</div>` +
         `<div id="tyList"></div>` +
         `<button class="btn" id="tyAdd" style="width:100%;margin-top:4px">+ 타입 추가</button>`,
    footer:`<button class="btn" data-a="c">취소</button><button class="btn pri" data-a="s">저장</button>`
  });
  const listEl = ov.querySelector('#tyList');
  const syncLabels = () => {
    listEl.querySelectorAll('.ty-row').forEach((r, i) => {
      if(!list[i]) return;
      list[i].label = r.querySelector('.ty-label').value;
      list[i].fields = r.querySelector('.ty-fields').value.split(',')
        .map(x => x.trim().slice(0, 24)).filter(Boolean).slice(0, 20);
    });
  };
  const draw = () => {
    listEl.innerHTML = list.map((t, i) =>
      `<div class="ty-row">` +
        `<span class="ty-tier">${i+1}</span>` +
        `<span class="ty-dot" style="background:${typeColorsAt(i).bg};border-color:${typeColorsAt(i).border}"></span>` +
        `<input class="ty-label" value="${escHtml(t.label)}" maxlength="20" placeholder="타입 이름">` +
      `<input class="ty-fields" value="${escHtml((t.fields||[]).join(', '))}" placeholder="기본 속성 (쉼표로: 나이, 소속)">` +
        `<button class="ty-btn" data-a="up" data-i="${i}" ${i===0?'disabled':''} title="위로">↑</button>` +
        `<button class="ty-btn" data-a="dn" data-i="${i}" ${i===list.length-1?'disabled':''} title="아래로">↓</button>` +
        `<button class="ty-btn dngr" data-a="del" data-i="${i}" ${list.length<=1?'disabled':''} title="삭제">×</button>` +
      `</div>`).join('');
  };
  draw();
  listEl.addEventListener('click', e => {
    const b = e.target.closest('.ty-btn'); if(!b) return;
    syncLabels();
    const i = +b.dataset.i;
    if(b.dataset.a === 'up' && i > 0){ [list[i-1], list[i]] = [list[i], list[i-1]]; }
    if(b.dataset.a === 'dn' && i < list.length-1){ [list[i+1], list[i]] = [list[i], list[i+1]]; }
    if(b.dataset.a === 'del'){
      const used = tab.nodes.filter(n => n.type === list[i].key).length;
      if(used){
        const moveTo = list.filter((_, k) => k !== i);
        const dest = moveTo[moveTo.length - 1];
        toast(`"${list[i].label}" 타입 노드 ${used}개는 저장 시 "${dest.label}"(으)로 바뀝니다`);
      }
      list.splice(i, 1);
    }
    draw();
  });
  ov.querySelector('#tyAdd').onclick = () => {
    syncLabels();
    list.push({key:newTypeKey(), label:'새 타입', fields:[]});
    draw();
    const inputs = listEl.querySelectorAll('input');
    const last = inputs[inputs.length-1]; if(last){ last.focus(); last.select(); }
  };
  ov.querySelector('[data-a=c]').onclick = () => closeModal(ov);
  ov.querySelector('[data-a=s]').onclick = () => {
    syncLabels();
    list = list.map(t => ({key:t.key, label:(t.label || '').trim().slice(0,20) || '무제', fields:t.fields || []}));
    if(!list.length){ toast('타입은 최소 1개 필요합니다', true); return; }
    /* 사라진 타입의 노드는 최하위 타입으로 옮긴다 — 노드를 잃지 않는 쪽을 택한다 */
    const keep = new Set(list.map(t => t.key));
    const fallback = list[list.length-1].key;
    let moved = 0;
    tab.nodes.forEach(n => { if(!keep.has(n.type)){ n.type = fallback; moved++; } });
    tab.nodeTypes = list;
    commit(); renderAll(); closeModal(ov);
    toast(moved ? `타입을 저장했습니다 — 노드 ${moved}개를 "${typeLabel(tab, fallback)}"(으)로 옮겼습니다` : '타입을 저장했습니다');
  };
}

      <div><label>데이터</label>
        <div class="row-btns">
          <button class="btn" id="stExport">💾 파일로 저장</button>
          <button class="btn" id="stImport">📂 파일에서 불러오기</button>
        </div>
        <div class="hint">저장은 <b>worldmind-export.json</b> 파일을 내려받습니다. 불러오기는 <b>모든 탭을 교체</b>하므로 편집 모드에서만 쓸 수 있습니다.</div>
      </div>
      <div class="infobox">AI 모델: ${AI_MODEL} · 이미지: ${IMG_MODEL}<br>
        API 키와 마스터 코드는 관리자의 서버(Cloudflare Worker)에서만 관리됩니다.
        ${API_BASE ? '서버: ' + escHtml(API_BASE) : '<span style="color:var(--danger)">⚠ 이 파일에 API_BASE가 설정되지 않아 AI 기능을 쓸 수 없습니다.</span>'}
      </div>`,
    footer:`<button class="btn" data-a="c">취소</button><button class="btn pri" data-a="s">저장</button>`
  });
  ov.querySelectorAll('[name=stTheme]').forEach(r => { r.onchange = () => applyTheme(r.value, false); });
  ov.querySelectorAll('[name=stEdge]').forEach(r => { r.onchange = () => applyEdgeMode(r.value, false); });
  ov.querySelectorAll('[name=stShape]').forEach(r => { r.onchange = () => applyEdgeShape(r.value, false); });
  const commitTheme = () => {
    const r = ov.querySelector('[name=stTheme]:checked');
    applyTheme(r ? r.value : prevTheme, true);
    const e = ov.querySelector('[name=stEdge]:checked');
    applyEdgeMode(e ? e.value : prevEdge, true);
    const sh = ov.querySelector('[name=stShape]:checked');
    applyEdgeShape(sh ? sh.value : prevShape, true);
    themeCommitted = true;
  };
  ov.querySelector('#stExport').onclick = exportJson;
  ov.querySelector('#stImport').onclick = () => {
    if(!editMode){ toast('불러오기는 모든 데이터를 덮어쓰므로 🔒 버튼으로 편집 모드에 들어간 뒤 사용할 수 있습니다', true); return; }
    $('#fileImport').click();
  };
  ov.querySelector('[data-a=c]').onclick = () => closeModal(ov);
  ov.querySelector('[data-a=s]').onclick = async () => {
    const fbEl = ov.querySelector('#stFb');
    if(fbEl){
      const raw = fbEl.value.trim();
      if(raw !== curFbRaw.trim()){
        localStorage.setItem('wm_fbcfg', raw);
        if(!raw){
          teardownFB();
        }else{
          const cfg = parseFbConfig(raw);
          if(!cfg){ toast('Firebase 설정 형식을 인식하지 못했습니다', true); return; }
          if(typeof firebase === 'undefined'){ toast('Firebase SDK를 불러오지 못했습니다 (네트워크 확인)', true); return; }
          commitTheme();
          closeModal(ov);
          await initFB(cfg, tabs.length > 0);
          if(fbReady) attachTab(activeTabId);
          toast('설정을 저장했습니다');
          return;
        }
      }
    }
    commitTheme();
    closeModal(ov);
    toast('설정을 저장했습니다');
  };
}


/* ==================================================================
 * §5-12 로드 UI
 * ================================================================== */
function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let d = null;
    try{ d = JSON.parse(reader.result); }catch(_){}
    const arr = d && Array.isArray(d.tabs) ? d.tabs : (Array.isArray(d) ? d : null);
    if(!arr || !arr.length){ toast('worldmind-export.json 형식이 아닙니다', true); return; }
    const nT = arr.length;
    const nN = arr.reduce((s,t) => s + (t.nodes?.length || 0), 0);
    const nE = arr.reduce((s,t) => s + (t.edges?.length || 0), 0);
    const nV = arr.reduce((s,t) => s + (t.events?.length || 0), 0);
    confirmModal({
      title:'📂 데이터 로드', danger:true, ok:'모두 덮어쓰고 로드',
      html:`<div class="infobox"><b>${escHtml(file.name)}</b><br>탭 ${nT}개 · 노드 ${nN}개 · 관계 ${nE}개 · 사건 ${nV}개</div>
            <div class="warnbox">⚠ 현재의 모든 세계관 데이터를 이 파일의 내용으로 덮어씁니다.<br>Firebase에 연결된 경우 서버 데이터도 함께 교체됩니다.</div>`,
      onOk:() => applyImport({tabs:arr})
    });
  };
  reader.onerror = () => toast('파일을 읽지 못했습니다', true);
  reader.readAsText(file);
}

/* ==================================================================
 * 정적 UI 바인딩 + 초기화
 * ================================================================== */
function bindStaticUI(){
  wrapEl = $('#cwrap');   worldEl = $('#world');   edgeSvg = $('#edgeSvg');
  nodesEl = $('#nodes');  tabsEl = $('#tabs');     modalsEl = $('#modals');
  toastsEl = $('#toasts');ctxEl = $('#ctxMenu');   rpEl = $('#rp');
  rpTitleEl = $('#rpTitle');
  bannerEl = $('#linkBanner');   genOverlayEl = $('#genOverlay');
  aiPanelEl = $('#aiPanel');     aiPanelInfoEl = $('#aiPanelInfo');
  syncDotEl = $('#syncDot');     syncTxtEl = $('#syncTxt');
  chatLogEl = $('#chatLog');     evListEl = $('#evList');
  pickBannerEl = $('#pickBanner'); marqueeEl = $('#marquee');
  guideV = $('#guideV');         guideH = $('#guideH');

  bindCanvasEvents();

  $('#tabAdd').onclick = addTab;
  $('#btnAddNode').onclick = () => openNodeModal(null);
  $('#btnAiGen').onclick = openAiGenModal;
  $('#btnLayout').onclick = askAutoLayout;
  $('#btnLock').onclick = toggleLock;
  $('#btnWorld').onclick = () => openPanel('world');
  $('#btnChat').onclick = () => openPanel('chat');
  $('#btnEvents').onclick = () => openPanel('events');
  $('#btnSearch').onclick = () => { const b = $('#searchBar'); b.hidden ? openSearch() : closeSearch(); };
  $('#searchClose').onclick = closeSearch;
  $('#searchPrev').onclick = () => stepSearch(-1);
  $('#searchNext').onclick = () => stepSearch(1);
  $('#searchInput').addEventListener('keydown', e => {
    e.stopPropagation();                       // 캔버스 단축키가 가로채지 않게
    if(e.key === 'Enter'){
      e.preventDefault();
      /* 검색어를 바꿨으면 다시 찾고, 그대로면 다음 결과로 넘어간다 */
      const v = String(e.target.value || '').trim().toLowerCase();
      if(v !== searchQuery || !searchHits.length) runSearch(e.target.value);
      else stepSearch(e.shiftKey ? -1 : 1);
      return;
    }
    if(e.key === 'ArrowDown'){ e.preventDefault(); stepSearch(1); return; }
    if(e.key === 'ArrowUp'){ e.preventDefault(); stepSearch(-1); return; }
    if(e.key === 'Escape'){ e.preventDefault(); closeSearch(); return; }
  });
  $('#searchInput').addEventListener('input', e => { if(!e.target.value.trim()) runSearch(''); });
  $('#btnTypes').onclick = openTypeManager;
  $('#btnImportAI').onclick = openImportModal;
  $('#btnSettings').onclick = openSettings;
  $('#fileImport').addEventListener('change', e => {
    handleImportFile(e.target.files[0]);
    e.target.value = '';
  });
  $('#rpClose').onclick = closePanel;
  $('#wpSave').onclick = () => {
    if(!reqEdit()) return;
    const tab = curTab(); if(!tab) return;
    tab.worldPrompt = $('#wpText').value;
    commit();
    toast('세계관 설정을 저장했습니다');
  };
  $('#refFile').addEventListener('change', e => {
    handleRefFile(e.target.files[0]);
    e.target.value = '';
  });
  $('#chatSend').onclick = sendChat;
  $('#chatText').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
  });
  $('#evAdd').onclick = () => openEventModal(null);
  $('#evAi').onclick = startEventPick;
  $('#linkCancel').onclick = exitLink;
  $('#btnUndo').onclick = doUndo;
  $('#pickGo').onclick = runEventPick;
  $('#pickCancel').onclick = () => { exitEventPick(); clearSel(); renderAll(); };
  $('#aiAccept').onclick = acceptPreview;
  $('#aiRetry').onclick = () => {
    if(!lastGenPrompt) return;
    clearPreview(); renderAll();
    runAiGen(lastGenPrompt);
  };
  $('#aiClose').onclick = () => { clearPreview(); renderAll(); };
  $('#zIn').onclick = () => { const r = wrapEl.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.25); };
  $('#zOut').onclick = () => { const r = wrapEl.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1/1.25); };
  $('#zFit').onclick = zoomFit;

  /* ⚠ 노드·엣지의 pointerdown 이 stopPropagation 하므로 버블 단계로는 못 잡는다 —
     Alt 를 누른 채 노드를 드래그하면 관계 추가 모드로 새는 것을 캡처 단계에서 막는다 */
  document.addEventListener('pointerdown', () => { altSolo = false; }, true);
  document.addEventListener('pointerdown', e => {
    if(!ctxEl.hidden && !ctxEl.contains(e.target)) closeCtx();
  });
  const typing = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  document.addEventListener('keydown', e => {
    /* Alt 단독 입력 판별 — 다른 키가 끼거나(Alt+Tab) 수식키를 동반하면 취소한다.
       Shift+Alt 는 윈도우 키보드 레이아웃 전환, Ctrl+Alt 는 AltGr 이라 오발동이 잦다.
       실제로 발동할 상황에서만 preventDefault 해 윈도우 메뉴바 활성화를 막는다. */
    if(e.key === 'Alt'){
      if(e.ctrlKey || e.shiftKey || e.metaKey) altSolo = false;
      else if(!e.repeat){
        altSolo = true;
        if(!typing() && !shortcutBusy() && sel.nodeIds.length === 1) e.preventDefault();
      }
    }
    else altSolo = false;

    if(e.key === ' ' && !typing()) spaceHeld = true;

    /* §5-2 캔버스 단축키 — Tab: 커서 위치에 노드 추가 / Delete·Backspace: 선택 삭제
       ⚠ Tab 은 편집 모드이고 캔버스에 포커스가 있을 때만 가로챈다. 그러지 않으면 툴바·패널
          버튼으로 가는 정방향 Tab 순회가 끊기고, 보기 전용에서는 순손실이 된다. */
    if(e.key === 'Tab' && editMode && onCanvasFocus() && !typing() && !shortcutBusy()
       && !e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey){
      e.preventDefault();
      openNodeModal(null, pointerWorld());
      return;
    }
    /* Ctrl+F — 노드 검색 (브라우저 찾기 대신 앱 검색) */
    if((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'f' || e.key === 'F')){
      e.preventDefault(); openSearch(); return;
    }
    /* 검색 결과가 있으면 캔버스에서도 ↑↓ 로 옮겨 다닌다 */
    if(searchHits.length && !typing() && !shortcutBusy() && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
      e.preventDefault(); stepSearch(e.key === 'ArrowDown' ? 1 : -1); return;
    }
    /* Ctrl+C — 선택 영역을 이미지(외부용) + 노드/관계(내부용)로 함께 복사 */
    if((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && !typing() && !shortcutBusy() && (e.key === 'c' || e.key === 'C')){
      if(sel.nodeIds.length){ e.preventDefault(); copySelection(); return; }
    }
    if((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && !typing() && !shortcutBusy() && (e.key === 'v' || e.key === 'V')){
      if(clipBuf){ e.preventDefault(); pasteClip(); return; }
    }
    if((e.key === 'Delete' || e.key === 'Backspace') && !typing() && !shortcutBusy()
       && (sel.nodeIds.length || sel.edgeId)){
      e.preventDefault();                    // 맥 노트북에는 Delete 키가 없어 Backspace 도 받는다
      askDeleteSelection();
      return;
    }
    /* 모달이 떠 있으면 되돌리기를 막는다 — 확인 모달의 onOk 가 이미 사라진 탭/객체를 만지지 않게 */
    if((e.ctrlKey || e.metaKey) && !typing() && !topModal() && (e.key === 'z' || e.key === 'Z')){
      e.preventDefault();
      e.shiftKey ? doRedo() : doUndo();
      return;
    }
    if((e.ctrlKey || e.metaKey) && !typing() && !topModal() && (e.key === 'y' || e.key === 'Y')){
      e.preventDefault(); doRedo(); return;
    }
    if(e.key !== 'Escape') return;
    if(!ctxEl.hidden){ closeCtx(); return; }
    if(!$('#searchBar').hidden){ closeSearch(); return; }
    if(linkMode.active){ exitLink(); return; }   // §9 ESC → 관계 추가 취소
    if(evPick.active){ exitEventPick(); clearSel(); renderAll(); return; }
    const tm = topModal();
    if(tm){ closeModal(tm); return; }
    if(sel.edgeId || sel.nodeIds.length){ clearSel(); renderAll(); }
  });
  document.addEventListener('keyup', e => {
    if(e.key === ' ') spaceHeld = false;
    /* Alt 단독 탭 → 선택한 노드에서 관계 추가 시작(대상 노드를 클릭해 연결) */
    if(e.key === 'Alt'){
      const solo = altSolo; altSolo = false;
      if(solo && !e.ctrlKey && !e.shiftKey && !e.metaKey
         && !typing() && !shortcutBusy() && sel.nodeIds.length === 1) startLink(sel.nodeIds[0]);
    }else altSolo = false;                   // Alt 를 누른 채 다른 키를 뗐다면 단독이 아니다
  });
  window.addEventListener('blur', () => { spaceHeld = false; altSolo = false; });
}

async function main(){
  bindStaticUI();
  applyTheme(localStorage.getItem('wm_theme') || 'dark', false);
  edgeColorMode = (localStorage.getItem('wm_edgecolor') === 'parent') ? 'parent' : 'clean';
  edgeShape = (localStorage.getItem('wm_edgeshape') === 'line') ? 'line' : 'curve';
  setStatus('off','오프라인');
  loadLocal();
  const hadLocal = tabs.length > 0;

  /* Firebase: 파일에 내장된 설정 우선, 없으면 이 브라우저에 저장된 설정(개발/개인용) */
  let cfg = FIREBASE_CONFIG || null;
  if(!cfg){ try{ cfg = parseFbConfig(localStorage.getItem('wm_fbcfg')); }catch(_){} }
  if(cfg){
    if(typeof firebase !== 'undefined') await initFB(cfg, hadLocal);
    else setStatus('err','연결 오류');
  }

  if(!tabs.length) tabs = [makeDefaultTab()];
  if(!tabs.find(t => t.id === activeTabId)) activeTabId = tabs[0].id;
  ensureIdCounter();
  seedUndo();                              // 되돌리기 기준점(탭별 + 구조)
  if(getToken()) editMode = true;          // 같은 세션(탭) 안에서는 새로고침해도 잠금 해제 유지
  if(editMode) sweepOrphanTabs();          // setEditMode 를 거치지 않는 복원 경로라 청소를 직접 예약
  if(editMode && fbReady) fbRefreshSession();   // 커스텀 토큰은 1시간짜리라 새로 받아 로그인한다
  updateModeUI();
  renderTabs(); renderAll(); zoomFit();
  if(fbReady) attachTab(activeTabId);

  /* §8-4: 자동 저장은 localStorage만 주기 실행. Firebase는 commit() 시 즉시 diff */
  setInterval(() => { if(dirtyLocal){ dirtyLocal = false; saveLocal(); } }, 1200);
  window.addEventListener('beforeunload', () => { if(dirtyLocal) saveLocal(); });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main);
else main();
</script>
